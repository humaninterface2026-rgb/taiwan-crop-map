<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>作物儀表板｜農知島</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="assets/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',sans-serif;background:#ffffff;min-height:100vh;display:flex;flex-direction:column;color:#5a4a30}
/* ── 原版 Dashboard 畫布：1440×1468 設計座標、等比縮放（照 App.tsx Dashboard 元件） ── */
.canvas-wrap{position:relative;width:100%;max-width:1440px;margin:0 auto;aspect-ratio:1440/1300;overflow:hidden;container-type:inline-size}
.canvas{position:absolute;inset:0;width:1440px;height:1468px;transform-origin:top left;transform:scale(calc(100cqw / 1440px))}
.canvas img.bg{display:block;width:1440px;height:auto;user-select:none;pointer-events:none}
.abs{position:absolute}
.card-shell{position:absolute;border-radius:14px;display:flex;flex-direction:column;font-family:'Noto Sans TC',sans-serif}
.hrow{display:flex;justify-content:space-between;align-items:center}
.chartbox{flex:1;background:#fff;border-radius:10px;padding:8px 10px;position:relative;min-height:0}
.nodata{flex:1;background:#fff;border:1px solid #eee;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#888;font-size:12px;text-align:center;padding:12px}
.pillbtn{cursor:pointer;font-family:inherit;font-weight:700}
canvas.cv{width:100%!important;height:100%!important}

/* ── 下方擴充：小農工具箱（概念稿的延伸區，整體包覆在一張大卡內） ── */
/* 左右內縮對齊上方圖表卡（設計座標 x=34..1407，於 1440 畫布中的比例）*/
.extend{max-width:1440px;margin:0 auto;width:100%;padding:14px calc(33/1440*100%) 0 calc(34/1440*100%)}
.ext-card{background:#ffffff;border:2px solid #e8dcc0;border-radius:26px;padding:22px 26px 18px;box-shadow:0 6px 24px rgba(122,84,24,.05)}
.ext-head{display:flex;align-items:baseline;gap:12px;margin:0 2px 14px;flex-wrap:wrap}
.ext-head .t{font-size:22px;font-weight:900;color:#7a5418;white-space:nowrap}
.ext-head .s{font-size:13px;color:#a89070;font-weight:700}
@media(max-width:640px){.ext-card{padding:16px 14px 12px}.ext-head .t{font-size:19px}}
#tbframe{width:100%;border:none;display:block;min-height:760px}
.wave{margin-top:30px;height:86px;background:radial-gradient(120% 70px at 50% 0,#ffffff 60%,transparent 61%),#a3b86c;position:relative;flex:none}
.wave .cp{position:absolute;bottom:18px;width:100%;text-align:center;font-size:12px;color:#f4f8e6;font-weight:700}
</style></head><body>

<div class="canvas-wrap"><div class="canvas" id="canvas">
  <img class="bg" src="assets/tomato_dashboard.avif" alt="作物市場儀表板">
  <a class="abs" href="./index.html" title="返回首頁" style="left:16px;top:6px;width:200px;height:56px;cursor:pointer;z-index:5"></a>
  <!-- 底圖右上的 ☰ 是烘焙像素、無功能——白補丁蓋掉 -->
  <div class="abs" style="left:1376px;top:14px;width:40px;height:36px;background:#fff;z-index:4"></div>
  <div id="cards"></div>
</div></div>

<div class="extend">
  <div class="ext-card">

    <iframe id="tbframe" title="小農工具箱"></iframe>

<div class="wave"><div class="cp">農知島 The Island of Harvest｜作物行情儀表板</div></div>

function isoYearWeek(ds) {
  const d = new Date(ds + 'T00:00:00');
  const t = new Date(d); t.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7)); // ISO 週四定年
  const y = t.getFullYear();
  const jan4 = new Date(y, 0, 4);
  const w = 1 + Math.round(((t - jan4) / 864e5 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
  return y + '-W' + String(w).padStart(2, '0');
}
function aggregateDaily(rows, keyFn) {
  const by = new Map();
  for (const r of rows) {
    if (r.price == null) continue;
    const k = keyFn(r);
    const o = by.get(k) || { pv: 0, v: 0 };
    o.pv += r.price * (r.volume || 0); o.v += (r.volume || 0);
    by.set(k, o);
  }
  return [...by.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1)
    .map(([k, o]) => ({ key: k, price: o.v > 0 ? Math.round(o.pv / o.v * 100) / 100 : 0, volume: o.v }));
}
function rocToISO(s) {
  const m = String(s).trim().match(/^(\d{2,3})[./](\d{1,2})[./](\d{1,2})$/);
  if (!m) return null;
  return (+m[1] + 1911) + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
}
async function fetchFromMOA(name) {
  const today = new Date(), past = new Date(); past.setFullYear(past.getFullYear() - 5);
  const roc = d => (d.getFullYear() - 1911) + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
  const base = name.split('-')[0];
  const url = 'https://data.moa.gov.tw/api/v1/AgriProductsTransType/?Start_time=' + roc(past) + '&End_time=' + roc(today) + '&CropName=' + encodeURIComponent(base);
  const j = await (await fetch(url)).json();
  let rows = (j.Data || j.data || []).map(r => ({
    date: rocToISO(r.TransDate || r.tdate), price: +(r.Avg_Price ?? r.avg_price), volume: +(r.Trans_Quantity ?? r.trans_quantity) || 0,
    market: r.MarketName || r.market_name || '', crop: r.CropName || r.crop_name || '',
  })).filter(r => r.date && r.price > 0 && r.crop !== '休市');
  if (name.includes('-')) {
    const exact = rows.filter(r => r.crop === name);
    if (exact.length) rows = exact;
  }
  if (!rows.length) return null;
  rows.sort((a, b) => a.date < b.date ? -1 : 1);
  const daily = aggregateDaily(rows, r => r.date).map(o => ({ date: o.key, price: o.price, volume: o.volume }));
  const monthly = aggregateDaily(rows, r => r.date.slice(0, 7));
  const lastMonth = monthly.length ? monthly[monthly.length - 1].key : null;
  const by = new Map();
  for (const r of rows) {
    if (r.date.slice(0, 7) !== lastMonth) continue;
    const o = by.get(r.market) || { pv: 0, v: 0 };
    o.pv += r.price * r.volume; o.v += r.volume; by.set(r.market, o);
  }
  const mv = [...by.entries()].map(([m, o]) => ({ market: m, volume: Math.round(o.v), price: o.v > 0 ? Math.round(o.pv / o.v * 100) / 100 : 0 }));
  return {
    name, latest_price: { date: daily[daily.length - 1].date, price: daily[daily.length - 1].price },
    daily,
    weekly: aggregateDaily(rows, r => isoYearWeek(r.date)),
    monthly,
    yearly: aggregateDaily(rows, r => r.date.slice(0, 4)),
    market_compare: {
      month: lastMonth,
      markets_volume: mv.filter(x => x.volume > 0).sort((a, b) => b.volume - a.volume),
      markets_price: mv.filter(x => x.price > 0).sort((a, b) => a.price - b.price),
    },
  };
}
/* ── 特殊品項行情來源（與主站同邏輯）──
 * 黑豬肉=畜產拍賣(規格豬,頭數加權,按日查28天)、石門活魚=漁產批發(草魚,範圍查14天)、
 * 蜂蜜=農業統計年均產地價(靜態年資料) */
const ANIMAL_URL  = 'https://data.moa.gov.tw/Service/OpenData/FromM/AnimalTransData.aspx';
const AQUATIC_URL = 'https://data.moa.gov.tw/Service/OpenData/FromM/AquaticTransData.aspx';
const HONEY_ANNUAL = [[104,148],[105,211],[106,300],[107,262],[108,200],[109,161],[110,227],[111,221],[112,239],[113,198],[114,324]];
const rocCompact = d => (d.getFullYear() - 1911) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
const isoFromRocCompact = s => { s = String(s); return (+s.slice(0, s.length - 4) + 1911) + '-' + s.slice(-4, -2) + '-' + s.slice(-2); };
function finishSeries(daily) {
  if (!daily.length) return null;
  const j = { daily };
  j.weekly  = aggregateDaily(daily, r => isoYearWeek(r.date));
  j.monthly = aggregateDaily(daily, r => r.date.slice(0, 7));
  j.yearly  = aggregateDaily(daily, r => r.date.slice(0, 4));
  const last = daily[daily.length - 1];
  j.latest_price = { date: last.date, price: last.price };
  return j;
}
function lsCache(key, ttlMs, fn) {
  try {
    const raw = localStorage.getItem(key);
    if (raw) { const o = JSON.parse(raw); if (Date.now() - o.at < ttlMs) return Promise.resolve(o.v); }
  } catch (e) {}
  return Promise.resolve(fn()).then(v => {
    if (v != null) { try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), v })); } catch (e) {} }
    return v;
  });
}
async function fetchStatic(fname) {
  // nongzhidao 每日預抓的靜態檔——秒載,不受 OpenData 端節流影響
  try {
    const j = await (await fetch(NZ + fname, { cache: 'no-store' })).json();
    if (j && Array.isArray(j.daily) && j.daily.length) return finishSeries(j.daily);
  } catch (e) {}
  return null;
}
async function fetchPig() {
  const s = await fetchStatic('market_pig.json');
  if (s) return s;
  return lsCache('nzd.pigMarket.v1', 6e5, async () => {
    // 14 天、每批 4 發——避免對 OpenData 端瞬間打太多請求觸發節流
    const now = new Date();
    const days = Array.from({ length: 14 }, (_, i) => new Date(now.getTime() - i * 864e5));
    const rows = [];
    for (let i = 0; i < days.length; i += 4) {
      const batch = await Promise.all(days.slice(i, i + 4).map(async d => {
        try {
          const ctrl = new AbortController();
          const to = setTimeout(() => ctrl.abort(), 12000);
          const r = await fetch(ANIMAL_URL + '?TransDate=' + rocCompact(d), { signal: ctrl.signal });
          clearTimeout(to);
          if (!r.ok) return null;
          const arr = await r.json();
          if (!Array.isArray(arr) || !arr.length) return null;
          let w = 0, n = 0;
          for (const x of arr) { const p = x['規格豬-平均價格'], c = x['規格豬-頭數']; if (p > 0 && c > 0) { w += p * c; n += c; } }
          return n ? { date: isoFromRocCompact(arr[0]['交易日期']), price: Math.round(w / n * 10) / 10, volume: n } : null;
        } catch (e) { return null; }
      }));
      rows.push(...batch);
    }
    return finishSeries(rows.filter(Boolean).sort((a, b) => a.date < b.date ? -1 : 1));
  });
}
async function fetchFish() {
  const s = await fetchStatic('market_fish.json');
  if (s) return s;
  return lsCache('nzd.fishMarket.v1', 6e5, () => _fetchFishRaw());
}
async function _fetchFishRaw() {
  const now = new Date(), from = new Date(now.getTime() - 13 * 864e5);
  let arr = null;
  for (let i = 0; i < 3 && !arr; i++) {
    if (i) await new Promise(r => setTimeout(r, 2000));
    try {
      const r = await fetch(AQUATIC_URL + '?StartDate=' + rocCompact(from) + '&EndDate=' + rocCompact(now));
      if (!r.ok) continue;
      const p = await r.json();
      if (Array.isArray(p) && p.length) arr = p;
    } catch (e) {}
  }
  if (!arr) return null;
  const by = new Map();
  for (const row of arr) {
    if (row['魚貨名稱'] !== '草魚') continue;
    const p = row['平均價'], q = row['交易量'];
    if (!(p > 0 && q > 0)) continue;
    const k = String(row['交易日期']);
    const o = by.get(k) || { w: 0, v: 0 };
    o.w += p * q; o.v += q; by.set(k, o);
  }
  const daily = [...by.entries()].map(([k, o]) => ({ date: isoFromRocCompact(k), price: Math.round(o.w / o.v * 10) / 10, volume: Math.round(o.v) }))
    .sort((a, b) => a.date < b.date ? -1 : 1);
  return finishSeries(daily);
}
function honeyMarket() {
  const daily = HONEY_ANNUAL.map(([roc, price]) => ({ date: (roc + 1911) + '-01-01', price, volume: 1 }));
  const j = finishSeries(daily);
  j.weekly = j.monthly = j.yearly;
  j.annual = true;
  return Promise.resolve(j);
}
async function fetchMarket() {
  if (rawCrop === '黑豬肉') return fetchPig();
  if (rawCrop === '石門活魚') return fetchFish();
  if (rawCrop === '蜂蜜') return honeyMarket();
  if (CROP.noMarket) return null;
  if (CROP.code) {
    try {
      const j = await (await fetch(NZ + CROP.code + '.json', { cache: 'no-store' })).json();
      // 照原版：weekly/monthly/yearly 一律由 daily 重建
      j.weekly = aggregateDaily(j.daily, r => isoYearWeek(r.date));
      j.monthly = aggregateDaily(j.daily, r => r.date.slice(0, 7));
      j.yearly = aggregateDaily(j.daily, r => r.date.slice(0, 4));
      if (!j.latest_price || j.latest_price.price == null) {
        const last = j.daily[j.daily.length - 1];
        j.latest_price = { date: last.date, price: last.price };
      }
      return j;
    } catch (e) { /* fallthrough → MOA */ }
  }
  try { return await fetchFromMOA(rawCrop); } catch (e) { return null; }
}

        tooltip: { callbacks: { label: c => c.dataset.label + ': ' + c.raw?.toLocaleString('zh-TW') + ' KG' } } },
      scales: { x: { ticks: { font: { size: 10 }, color: '#666', maxRotation: 60, minRotation: 45 }, grid: { display: false } },
        y: { title: { display: true, text: '交易量 (KG)', font: { size: 10 }, color: '#666' }, ticks: { font: { size: 10 }, color: '#666', callback: v => v.toLocaleString('zh-TW') }, grid: { color: 'rgba(0,0,0,0.05)' } } } } });
  mk('c_cmp', { type: 'bar',
    data: { labels: mc.markets_price.map(x => x.market),
      datasets: [{ label: '當月加權均價 (NTD/公斤, 低到高)', data: mc.markets_price.map(x => Math.round(x.price * 10) / 10), backgroundColor: 'rgba(245,167,40,0.9)', borderColor: '#d88820', borderWidth: 1 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { font: { size: 11 }, color: '#a8581a' } },
        tooltip: { callbacks: { label: c => c.dataset.label + ': $' + c.raw + ' / 公斤' } } },
      scales: { x: { ticks: { font: { size: 10 }, color: '#666', maxRotation: 60, minRotation: 45 }, grid: { display: false } },
        y: { title: { display: true, text: '價格 (NTD/公斤)', font: { size: 10 }, color: '#666' }, ticks: { font: { size: 10 }, color: '#666' }, grid: { color: 'rgba(0,0,0,0.05)' } } } } });
}

/* ── 外銷卡（useCropTrade 邏輯） ── */
let TRADE = null, expPeriod = 'yearly', expCountry = '全球';
function rocKeyToWestern(k) {
  const m = String(k).match(/^(\d{2,3})(?:-(\d{2}))?$/);
  if (!m) return k;
  const y = +m[1] < 200 ? +m[1] + 1911 : +m[1];
  return m[2] ? y + '-' + m[2] : String(y);
}
async function fetchTrade() {
  const slug = TRADE_COA_MAP[rawCrop];
  if (slug) {
    try { return await (await fetch(NZ + 'trade_' + slug + '.json')).json(); } catch (e) {}
  }
  if (CROP.isTomato) {
    try { return (await (await fetch('assets/page-data.json')).json()).datasets.tomato_export; } catch (e) {}
  }
  return null;
}
function drawExport() {
  if (!TRADE) return;
  const cd = TRADE.data[expCountry] || TRADE.data[Object.keys(TRADE.data)[0]];
  if (!cd) return;
  const series = expPeriod === 'yearly' ? cd.yearly : cd.monthly;
  let entries = Object.entries(series);
  entries = expPeriod === 'yearly' ? entries.slice(-11) : entries.slice(-60);
  const labels = entries.map(e => rocKeyToWestern(e[0]));
  const weights = entries.map(e => e[1]?.w ?? null);
  const prices = entries.map(e => (e[1]?.w && e[1]?.v) ? Math.round(e[1].v * 1000 / e[1].w) : null);
  mk('c_exp', { type: 'bar',
    data: { labels,
      datasets: [
        { label: '出口量 (公噸)', data: weights, backgroundColor: 'rgba(189,211,250,0.95)', borderColor: 'rgba(165,193,238,1)', borderWidth: 1, yAxisID: 'y2', order: 2, barPercentage: .75, categoryPercentage: .85 },
        { label: '均價 (NTD/公噸)', data: prices, type: 'line', borderColor: '#9070d0', backgroundColor: '#9070d0', yAxisID: 'y1', tension: .25, pointRadius: expPeriod === 'yearly' ? 4 : 1.5, pointHoverRadius: 6, borderWidth: 2.5, order: 1, spanGaps: true },
      ] },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'top', labels: { font: { size: 11 }, boxWidth: 14, color: '#5d3fb8' } },
        tooltip: { callbacks: { label: c => c.raw == null ? c.dataset.label + ': —' : c.dataset.label + ': ' + c.raw.toLocaleString('zh-TW') } } },
      scales: {
        x: { ticks: { font: { size: 11 }, color: '#666', maxRotation: 0, autoSkip: true, maxTicksLimit: expPeriod === 'yearly' ? 11 : 8 }, grid: { display: false } },
        y1: { position: 'left', title: { display: true, text: '均價 (NTD/公噸)', font: { size: 10 }, color: '#666' }, ticks: { font: { size: 10 }, color: '#666' }, grid: { color: 'rgba(0,0,0,0.05)' } },
        y2: { position: 'right', title: { display: true, text: '出口量 (公噸)', font: { size: 10 }, color: '#666' }, ticks: { font: { size: 10 }, color: '#666' }, grid: { drawOnChartArea: false } },
      } } });
}
function setExpPills() {
  document.querySelectorAll('.ep').forEach(x => {
    const on = x.dataset.k === expPeriod;
    x.style.border = '1px solid ' + (on ? '#7560d4' : '#e8dfd0');
    x.style.background = on ? '#7560d4' : '#faf2dd';
    x.style.color = on ? '#fff' : '#a8956e';
  });
}
document.querySelectorAll('.ep').forEach(b => b.addEventListener('click', () => { expPeriod = b.dataset.k; setExpPills(); drawExport(); }));
document.getElementById('exp_cty').addEventListener('change', e => { expCountry = e.target.value; drawExport(); });

async function drawDisaster() {
  let ds = null;
  try {
    const j = await (await fetch(NZ + 'tw_crop_disaster_yearly.json')).json();
    if (j.yearly && j.yearly.length) ds = j;
  } catch (e) {}
  if (!ds) { try { ds = (await (await fetch('assets/page-data.json')).json()).datasets.disaster_yearly; } catch (e) {} }
  if (!ds) return;
  mk('c_dis', { type: 'bar',
    data: { labels: ds.yearly.map(r => r.year),
      datasets: [
        { label: '災損金額 (億元)', data: ds.yearly.map(r => r.loss_100m_ntd), backgroundColor: 'rgba(245,150,150,0.85)', borderColor: '#e67878', borderWidth: 1, yAxisID: 'y1', order: 2 },
        { label: '災損數量 (公噸)', data: ds.yearly.map(r => r.loss_qty_ton), type: 'line', borderColor: '#3fb6c8', backgroundColor: '#3fb6c8', tension: .25, pointRadius: 4, pointHoverRadius: 6, borderWidth: 2.5, yAxisID: 'y2', order: 1 },
      ] },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'top', labels: { font: { size: 11 }, color: '#3a6a78' } },
        tooltip: { callbacks: { label: c => c.raw == null ? c.dataset.label + ': —' : c.dataset.label + ': ' + c.raw.toLocaleString('zh-TW') } } },
      scales: {
        x: { ticks: { font: { size: 11 }, color: '#666' }, grid: { display: false } },
        y1: { position: 'left', title: { display: true, text: '金額 (億元)', font: { size: 10 }, color: '#666' }, ticks: { font: { size: 10 }, color: '#666' }, grid: { color: 'rgba(0,0,0,0.05)' } },
        y2: { position: 'right', title: { display: true, text: '數量 (公噸)', font: { size: 10 }, color: '#666' }, ticks: { font: { size: 10 }, color: '#666', callback: v => v.toLocaleString('zh-TW') }, grid: { drawOnChartArea: false } },
      } } });
}

/* ════ boot ════ */
(async () => {
  // pill 初始狀態（特殊品項的檔位表可能沒有 weekly，點第一顆）
  const firstPill = document.querySelector('.tp[data-k="weekly"]') || document.querySelector('.tp');
  firstPill?.click();
  setExpPills();

  // 載入指示：行情到位前別讓使用者面對空白
  if (!CROP.noMarket) {
    const pk = document.getElementById('pp_kg');
    if (pk) pk.textContent = '載入中…';
  }
  fetchMarket().then(m => {
    M = m;
    if (M) { fillPricePanel(); drawTrend(); drawMarketBars(); }
    else if (!CROP.noMarket) {
      const pk = document.getElementById('pp_kg');
      if (pk) pk.textContent = '暫時無法取得';
      const tb = document.getElementById('c_trend');
      if (tb) tb.parentElement.innerHTML = '<div class="nodata" style="font-size:12px">行情資料暫時無法取得，請稍後重新整理</div>';
    }
  });

  fetchTrade().then(t => {
    TRADE = t;
    if (!TRADE) {
      const slug = TRADE_COA_MAP[rawCrop];
      document.getElementById('exp_box').innerHTML =
        '<div class="nodata" style="border:1px solid #e4dff0;font-size:13px">' +
        (slug ? '外銷資料載入中…' : '此品項目前沒有外銷貿易統計資料<br><span style="font-size:11px;color:#aaa">(海關出口統計未單獨列出此品項)</span>') + '</div>';
      return;
    }
    document.getElementById('exp_title').textContent = '外銷趨勢圖 · ' + (TRADE.name || CROP.display);
    const sel = document.getElementById('exp_cty');
    sel.innerHTML = Object.keys(TRADE.data).sort().map(k => '<option' + (k === expCountry ? ' selected' : '') + '>' + k + '</option>').join('');
    if (!TRADE.data[expCountry]) { expCountry = TRADE.data['全球'] ? '全球' : Object.keys(TRADE.data)[0]; sel.value = expCountry; }
    drawExport();
  });

  drawDisaster();
})();
</script>
