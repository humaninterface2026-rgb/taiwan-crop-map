<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小農工具箱｜農知島</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="toolbox-shared.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',sans-serif;background:#faf6ec;color:#5a4a30;min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:1200px;margin:0 auto;padding:28px 24px 0;width:100%;flex:1}
header{display:flex;align-items:center;justify-content:space-between}
.brand{font-size:24px;font-weight:900;color:#7a5418;letter-spacing:2px}
.brand small{font-size:11px;font-weight:700;color:#a89070;letter-spacing:0;margin-left:8px}
.backlink{font-size:14px;font-weight:700;color:#7a5418;text-decoration:none;background:#fff;border:2px solid #d8c9a4;border-radius:99px;padding:7px 18px}
.backlink:hover{background:#f6efdc}

.mock{background:#fffdf6;border:2px solid #e8dcc0;border-radius:26px;padding:24px 26px;margin-top:22px}
.mh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mh .t{font-size:24px;font-weight:900;color:#7a5418}
.mh .s{font-size:13.5px;color:#a89070;font-weight:700}
.banner{display:flex;align-items:flex-end;gap:20px;margin-top:16px;background:linear-gradient(180deg,#fdf9ea 55%,#dfeec2 100%);border:2px solid #ecdfc0;border-radius:20px;padding:18px 24px 0;overflow:hidden}
.banner img{width:130px;display:block;flex:none;border-radius:16px 16px 0 0;border:3px solid #fff;border-bottom:none;box-shadow:0 2px 10px rgba(122,84,24,.08)}
#stage{position:relative;width:168px;flex:none;display:flex;justify-content:center;align-items:flex-end}
#stagegrass{position:absolute;left:50%;transform:translateX(-50%);bottom:-1px;width:168px;height:46px;pointer-events:none;display:none}
img.charimg{position:relative;width:126px;height:126px;object-fit:contain;flex:none;display:block;border:none;border-radius:0;box-shadow:none;margin-bottom:16px;z-index:1}
.bubble{position:relative;background:#fff;border:2.5px solid #d8c9a4;border-radius:16px;padding:14px 20px;margin-bottom:26px;max-width:660px}
.bubble:before{content:'';position:absolute;left:-14px;bottom:18px;border:10px solid transparent;border-right-color:#d8c9a4}
.bubble:after{content:'';position:absolute;left:-10px;bottom:20px;border:8px solid transparent;border-right-color:#fff}
.bubble .b1{font-size:16.5px;font-weight:900}
.bubble .b2{font-size:13px;color:#8a7a5c;margin-top:3px}
/* 手機：橫幅改直向堆疊（角色在上、對話框全寬在下），避免對話框被擠成直排 */
@media(max-width:640px){
  .banner{flex-direction:column;align-items:center;gap:6px;padding:16px 16px 0}
  #stage{width:140px}
  #stagegrass{width:140px;height:38px}
  img.charimg{width:104px;height:104px;margin-bottom:12px}
  .bubble{max-width:100%;width:100%;margin-bottom:16px}
  .bubble:before,.bubble:after{display:none}
  .mh .t{white-space:nowrap}
}

.tabs{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.tab{border-radius:99px;padding:9px 18px;font-size:15px;font-weight:900;border:2px solid #d8c9a4;color:#8a7a5c;background:#fff;cursor:pointer;user-select:none}
.tab .c{font-size:12px;font-weight:700;background:#f1ead8;color:#a89070;border-radius:99px;padding:1px 8px;margin-left:5px}
.tab.on{background:#7fae4e;border-color:#7fae4e;color:#fff;box-shadow:0 3px 0 #5d8a34}
.tab.on .c{background:rgba(255,255,255,.28);color:#fff}

.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
@media(max-width:900px){.tools{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.tools{grid-template-columns:1fr}}
.tool{border-radius:18px;padding:16px 18px;border:2px solid;display:flex;flex-direction:column;gap:7px;cursor:pointer;transition:transform .12s}
.tool:hover{transform:translateY(-3px)}
.tool .ic{width:46px;height:46px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid rgba(0,0,0,.05)}
.tool .nm{font-size:16.5px;font-weight:900}
.tool .ds{font-size:13px;color:#7a6a4c;line-height:1.5;flex:1}
.tg{align-self:flex-start;font-size:12px;font-weight:900;border-radius:99px;padding:3px 11px}
.t-chat{background:#dce8b8;color:#3b6826}
.t-data{background:#d0e8f8;color:#427ea1}
.t-auto{background:#FDEBBF;color:#a85a16}
.t-link{background:#f8d8d0;color:#b05548}
.s0{background:#f2f7e6;border-color:#cfe0a8}
.s1{background:#e8f3fb;border-color:#b8d8ee}
.s2{background:#fdf0e0;border-color:#f0d0a8}
.s3{background:#eceafa;border-color:#cfc8ee}
.s4{background:#e4f5ef;border-color:#b0dcc8}
.footnote{margin-top:14px;font-size:12.5px;color:#a89070}
.footnote b{color:#3b6826}
.swsel{font-size:12.5px;font-weight:700;color:#7a5418;background:#fff;border:2px solid #d8c9a4;border-radius:99px;padding:5px 10px;font-family:inherit;cursor:pointer}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(90,74,48,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50}
.overlay.show{display:flex}
.modal{width:640px;max-width:100%;background:#fffdf6;border:2px solid #e8dcc0;border-radius:24px;padding:24px 26px;box-shadow:0 10px 30px rgba(122,84,24,.18)}
.modal .mhd{display:flex;align-items:center;justify-content:space-between}
.modal .mt{font-size:21px;font-weight:900;color:#7a5418}
.modal .mx{width:34px;height:34px;border-radius:99px;background:#f1ead8;color:#a89070;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;border:none}
.modal .msub{font-size:13px;color:#a89070;margin-top:4px}
.ptitle{font-size:14px;font-weight:900;color:#3b6826;margin-top:16px}
.plist{margin-top:8px;display:flex;flex-direction:column;gap:7px}
.pitem{background:#fff;border:2px solid #e8e0c8;border-radius:12px;padding:9px 14px;font-size:13.5px;color:#6a5a3e;line-height:1.55}
.extra{margin-top:12px;font-size:12.5px;color:#a89070;line-height:1.6}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(max-width:520px){.inputs{grid-template-columns:1fr}}
.infield{background:#fff;border:2px solid #e0d4b4;border-radius:13px;padding:9px 13px}
.infield .l{font-size:11.5px;font-weight:700;color:#a89070}
.inrow{display:flex;align-items:baseline;gap:5px}
.infield input,.infield select{border:none;outline:none;font-family:inherit;font-size:17px;font-weight:900;color:#5a4a30;width:100%;background:transparent;margin-top:2px}
.infield .u{font-size:11.5px;color:#a89070;font-weight:700;white-space:nowrap}
.gobtn{margin-top:15px;background:#7fae4e;color:#fff;font-size:16px;font-weight:900;border-radius:99px;padding:11px 0;text-align:center;box-shadow:0 3px 0 #5d8a34;cursor:pointer;border:none;width:100%;font-family:inherit}
.gobtn:active{transform:translateY(2px);box-shadow:0 1px 0 #5d8a34}
.result{display:none;gap:13px;margin-top:16px;background:#f2f7e6;border:2px solid #cfe0a8;border-radius:16px;padding:14px 16px;align-items:flex-start}
.result.show{display:flex}
.result img{width:56px;height:56px;border-radius:99px;border:2.5px solid #fff;flex:none}
.result .r1{font-size:15.5px;font-weight:900;color:#3b6826;line-height:1.5}
.result .r2{font-size:13px;color:#7a6a4c;margin-top:5px;line-height:1.65}
.phase-badge{display:inline-block;margin-top:14px;font-size:12px;font-weight:900;background:#FDEBBF;color:#a85a16;border-radius:99px;padding:4px 13px}

.wave{margin-top:44px;height:86px;background:radial-gradient(120% 70px at 50% 0,#faf6ec 60%,transparent 61%),#a3b86c;position:relative;flex:none}
.wave .cp{position:absolute;bottom:18px;width:100%;text-align:center;font-size:12px;color:#f4f8e6;font-weight:700}
</style></head><body>
<div class="wrap">
  <header>
    <div class="brand">農知島 <small>The Island of Harvest</small></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="backlink" id="farmbtn" href="javascript:void 0">⚙️ 我的農場</a>
      <a class="backlink" id="dashlink" href="./crop-dashboard.html">📊 行情儀表板</a>
      <a class="backlink" href="./index.html">← 回作物地圖</a>
    </div>
  </header>

  <div class="mock">
    <div class="mh"><div class="t">🧰 小農工具箱</div><div class="s" id="subline">番茄・桃園市｜30 個小幫手（MVP）</div>
      <span style="display:flex;gap:6px;margin-left:auto" id="switcher">
        <select id="sw_county" class="swsel"></select><select id="sw_crop" class="swsel"></select>
      </span></div>
    <div class="banner">
      <div id="stage">
        <div id="stagegrass"></div>
        <img id="mascot" src="toolbox-assets/m_tomato.png" alt="作物吉祥物">
      </div>
      <div class="bubble">
        <div class="b1">從種到賣，都可以問我！</div>
        <div class="b2">選一個階段，挑個工具開始吧～不知道從哪開始的話，先試試「成本試算」！</div>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="tools" id="tools"></div>
    <div class="footnote">＊「🛒 銷售市場」的<b>即時行情查詢</b>由儀表板行情圖表取代，故工具數為 30。標籤說明：🗣 用聊的就好｜📡 吃即時資料｜🔔 自動幫你盯｜🤝 幫你牽線</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<div class="wave"><div class="cp">農知島 The Island of Harvest｜小農工具箱 MVP</div></div>

<script>
const TYPES = {
  chat: { cls: 't-chat', label: '🗣 用聊的就好' },
  data: { cls: 't-data', label: '📡 吃即時資料' },
  auto: { cls: 't-auto', label: '🔔 自動幫你盯' },
  link: { cls: 't-link', label: '🤝 幫你牽線' },
};

const STAGES = [
  { name: '種前規劃', icon: '🌱' },
  { name: '生長管理', icon: '💧' },
  { name: '採收保鮮', icon: '🧺' },
  { name: '銷售市場', icon: '🛒' },
  { name: '經營管理', icon: '📊' },
];

const TOOLS = [
  // ── 種前規劃 ──
  { stage: 0, icon: '🌱', type: 'chat', name: '作物選種建議', desc: '幫你依定植月份和目標挑對路的品種方向。', calc: 'variety',
    principles: ['高溫潮濕：優先耐熱、抗病（青枯/葉斑）型', '日夜溫差大：可選高糖度與果色穩定型', '黏土：建議嫁接苗或強根系砧木，降低積水風險'],
    extra: '之後可選地區（北/中/南/東）、氣候、土壤後直接產生建議。' },
  { stage: 0, icon: '🔄', type: 'chat', name: '輪作／間作規劃', desc: '幫你排下幾季種什麼，避免連作生病。', calc: 'rotate',
    principles: ['避免茄科連作超過 2 季', '至少插入 1 季非茄科（豆科/十字花科/禾本科）', '間作可用短期葉菜或香草作物分散病蟲壓力'],
    extra: '之後可選規劃季數（2–4 季）與目標（穩定收益/土壤恢復/降病蟲害）。' },
  { stage: 0, icon: '📅', type: 'data', name: '最佳播種時機', desc: '看未來 16 天哪天最適合播種，選定後幫你排整季時程。', custom: 'sow',
    principles: ['理想：20~30°C 且雨量 <60mm/7日', '可播但需管理：16~20°C 或 60~120mm/7日', '不建議：<16°C、>32°C 或雨量 >120mm/7日'],
    calc: 'sow' },
  { stage: 0, icon: '🧮', type: 'chat', name: '成本試算', desc: '輸入面積和預算，幫你算成本和毛利。',
    principles: ['常態範例（1 分地）：產量 3,200 kg/分、售價 40~50 元/kg、總成本約 3.8~5.5 萬元', '毛收入約 12.8~16.0 萬元，毛利常見落點約 7.3~12.2 萬元/分地'],
    calc: 'cost' },
  { stage: 0, icon: '🪱', type: 'chat', name: '土壤／地力分析', desc: '輸入 pH 和有機質，直接給你資材採買清單。', calc: 'soil',
    principles: ['pH 建議：6.0 ~ 6.8', '有機質以「適中」為佳，過低補有機質、過高防氮過剩', '排水、通氣、根系健康比單次施肥更關鍵'] },
  { stage: 0, icon: '📋', type: 'data', name: '補助申請助理', desc: '三題快篩，看你符合哪些補助、缺什麼文件。', calc: 'subsidy',
    principles: [],
    extra: '可直接問：「我有 2 分地牛蕃茄，想申請灌溉設備補助，幫我整理可申請方案與所需文件」。' },
  // ── 生長管理 ──
  { stage: 1, icon: '💧', type: 'auto', name: '灌溉排程', desc: '幫你算今天要不要澆水、什麼時候澆。', calc: 'water',
    principles: ['土壤濕度目標區間：約 40%~60%', '建議時段：清晨為主，必要時傍晚補水，避免中午高溫灌溉', '豪雨後優先排水，再評估是否補灌'] },
  { stage: 1, icon: '🧪', type: 'chat', name: '施肥計畫', desc: '照生長階段幫你排肥料怎麼下、下多少。', calc: 'fert',
    principles: ['苗期：根系建立優先，氮不宜過高避免徒長', '開花期：提高鉀、鈣、硼，提升開花著果率', '結果期：分次追肥，鉀鈣為主，控制氮避免裂果與軟果'] },
  { stage: 1, icon: '🐛', type: 'chat', name: '病蟲害辨識', desc: '照症狀一步步問答，判斷可能是什麼、先做什麼。', calc: 'pest',
    principles: ['拍照：葉片正反面＋莖部＋果實（同地塊至少 3 株）', '葉斑：常見早晚疫病/細菌性斑點', '捲葉：常見病毒病或粉蝨壓力', '黃化：常見根系受損、缺素或病害前期'] },
  { stage: 1, icon: '⛈️', type: 'auto', name: '氣象預警推播', desc: '壞天氣來之前先警報，提醒你顧好田區。', calc: 'warn',
    principles: ['強風：風速 ≥10 級｜倒伏、落果、設施損傷', '高溫：日間 ≥35°C｜日灼、授粉不良', '低溫：最低溫 ≤12°C｜生長停滯、著果率下降', '暴雨：24h ≥80mm｜積水、根腐與青枯病壓力上升'] },
  { stage: 1, icon: '📝', type: 'auto', name: '作業日誌記錄', desc: '兩下點選就記好今天田裡做了什麼，全存在手機裡。', custom: 'logs',
    principles: ['建議格式：日期／地塊／作業內容／投入人力／異常狀況（支援語音轉文字）'],
    extra: '例：「今天 16:30 灌溉 20 分鐘，番茄區 B 有黃葉」。' },
  { stage: 1, icon: '📶', type: 'data', name: 'IoT 感測器整合', desc: '把田裡量到的數值輸進來，馬上判斷要不要處理。', calc: 'readings',
    principles: ['異常門檻範例：土壤濕度 <30%、棚內 >35°C、濕度 >90% 持續 2 小時即告警'] },
  { stage: 1, icon: '🚁', type: 'data', name: '無人機影像分析', desc: '想代噴或空拍巡田？告訴你怎麼找服務、行情多少。', calc: 'drone',
    principles: ['流程：空拍影像 → 區塊分割 → 異常熱點標記 → 回傳巡田優先順序'] },
  { stage: 1, icon: '🛡️', type: 'chat', name: '連作障礙預防', desc: '幫你評估連作風險，避免越種越差。', calc: 'chain',
    principles: ['低風險：連作 <2 季 且 病害 ≤1 次', '中風險：連作 2 季 或 病害 1~2 次', '高風險：連作 ≥3 季 或 病害 ≥2 次'] },
  // ── 採收保鮮 ──
  { stage: 2, icon: '⏰', type: 'data', name: '採收時機預測', desc: '幫你抓最好採收時間，不怕採太早或放過熟。', calc: 'harvest',
    principles: ['主窗口：約定植後 85~110 天', '高溫（≥27°C）時成熟會提早 5~7 天', '建議分批採收，先採轉色果與成熟度高果'] },
  { stage: 2, icon: '🏅', type: 'chat', name: '產品分級建議', desc: '幫你把果實分 A、B、C 級，好貨賣好價。', calc: 'grade',
    principles: ['A級：果形完整、色澤均勻、無明顯外傷', 'B級：輕微瑕疵，不影響食用品質', 'C級：外觀或硬度不足，建議加工或促銷'] },
  { stage: 2, icon: '❄️', type: 'chat', name: '保鮮／儲存建議', desc: '教你溫濕度怎麼設，番茄放更久不軟爛。', calc: 'store',
    principles: ['建議 10~13°C、85~90%RH', '避免與高乙烯水果（香蕉、蘋果）同倉', '先分級再入庫，可降低交叉損耗'] },
  { stage: 2, icon: '📈', type: 'data', name: '產量預估', desc: '輸入面積和季節，幫你抓這季大概收多少。',
    principles: ['總產量 = 面積 × 基準值 × 季節基準倍率 × 季節係數', '春季常較佳、夏季常偏低（以氣候風險折算）'],
    calc: 'yield' },
  { stage: 2, icon: '🏭', type: 'link', name: '加工建議', desc: '看庫存和價格，幫你決定鮮售還是轉加工。', calc: 'proc',
    principles: ['庫存門檻：高 >800kg／中 400~800kg／低 <400kg', '價格門檻：低 <40／中 40~50／高 >50 元/kg', '高庫存＋低價優先加工；低庫存＋高價優先鮮售'] },
  // ── 銷售市場 ──
  { stage: 3, icon: '🏷️', type: 'chat', name: '定價策略建議', desc: '幫你依品質和通路算出建議售價。', calc: 'price',
    principles: ['品質係數：A 1.15、B 1.00、C 0.85', '通路係數：批發 1.00、直銷 1.10、電商 1.20', '行情判讀：低價 <40、中價 40~55、高價 >55 元/kg'] },
  { stage: 3, icon: '🔗', type: 'auto', name: '溯源履歷生成', desc: '一鍵把產地、時程、用藥紀錄整理成履歷卡。', calc: 'trace',
    principles: [] },
  { stage: 3, icon: '🤝', type: 'link', name: '買家媒合', desc: '想走哪種通路？給你具體的接洽方法和眉角。', calc: 'buyer',
    principles: [] },
  { stage: 3, icon: '📣', type: 'link', name: '行銷文案生成', desc: '幫你寫貼文文案，把今天採收的番茄賣出去。', calc: 'copywrite',

// ── 三個可算工具（邏輯移植自 FJ3） ──
const CALCS = {
  cost: {
    inputs: [
      { key: 'area', label: '種植面積', unit: '分地', def: '1' },
      { key: 'seedlingPrice', label: '種苗單價', unit: '元/株', def: '8' },
      { key: 'fertPerFen', label: '肥料成本', unit: '元/分地', def: '6000' },
      { key: 'pestPerFen', label: '農藥資材', unit: '元/分地', def: '3000' },
      { key: 'rentPerFen', label: '地租', unit: '元/分地/季', def: '8000' },
      { key: 'laborPerFen', label: '人力預算', unit: '元/分地', def: '18000' },
      { key: 'yieldKgPerFen', label: '預估產量', unit: 'kg/分', def: '3200' },
      { key: 'pricePerKg', label: '預估售價', unit: '元/kg', def: '50' },
    ],
    async prepare() {
      const fields = NZD.S.get('fields', []);
      if (fields.length) {
        const sum = fields.reduce((a, f) => a + (+f.area_fen || 0), 0);
        if (sum > 0) document.getElementById('f_area').value = sum;
      }
      if (NZD.A._pack) {
        document.getElementById('f_yieldKgPerFen').value = NZD.A.normalYieldKgFen;
        document.getElementById('f_seedlingPrice').value = '';
      }
      const saved = NZD.S.get('cost');
      let noteBits = [];
      if (fields.length) noteBits.push('面積已帶入你的田區合計');
      try {
        const m = await getMarket();
        if (m && m.latest_price) {
          document.getElementById('f_pricePerKg').value = m.latest_price.price;
          noteBits.push('售價已帶入今日批發均價 <b>' + m.latest_price.price + ' 元/kg</b>');
        }
      } catch (e) {}
      if (saved) noteBits.push('上次試算：' + (saved.saved_at || '').slice(0, 10) + ' 總成本 ' + (saved.total_cost || 0).toLocaleString() + ' 元');
      calcNote(noteBits.length ? '📡 ' + noteBits.join('；') : '');
    },
    run(v) {
      const area = +v.area || 0, seed = +v.seedlingPrice || 0, fert = +v.fertPerFen || 0,
        pest = +v.pestPerFen || 0, rent = +v.rentPerFen || 0, labor = +v.laborPerFen || 0;
      const y = +v.yieldKgPerFen || NZD.A.normalYieldKgFen, p = +v.pricePerKg || 50;
      const seedlings = area * NZD.A.plantsPerFen * seed;
      const total = seedlings + (fert + pest + rent + labor) * area;
      const totalYield = Math.max(1, area * y);
      const breakeven = total / totalYield;
      const scen = m => Math.round(totalYield * p * m - total);
      const fmt = n => Math.round(n).toLocaleString();
      const light = p >= breakeven * 1.2 ? '🟢 照這售價有不錯的利潤空間'
        : p >= breakeven ? '🟡 有賺但空間不大，售價要顧好' : '🔴 照這售價會賠，要嘛降成本要嘛等價';
      NZD.S.set('cost', { saved_at: new Date().toISOString(), area_fen: area,
        items: { seedlings: Math.round(seedlings), fert: fert * area, pest: pest * area, rent: rent * area, labor: labor * area },
        total_cost: Math.round(total), expected_qty: Math.round(totalYield), breakeven_price: +breakeven.toFixed(1), expected_price: p });
      return {
        headline: '種 ' + area + ' 分地總投入約 ' + fmt(total) + ' 元，一公斤賣過 ' + breakeven.toFixed(1) + ' 元就不賠！',
        detail: '成本組成：種苗 ' + fmt(seedlings) + '、肥料 ' + fmt(fert * area) + '、農藥資材 ' + fmt(pest * area)
          + '、地租 ' + fmt(rent * area) + '、人力 ' + fmt(labor * area) + ' 元。預估產量 ' + fmt(totalYield) + ' kg。'
          + '三種行情試算（照 ' + p + ' 元/kg 為基準）：行情差 8 折→淨利 ' + fmt(scen(0.8)) + ' 元；持平→ ' + fmt(scen(1))
          + ' 元；行情好 1.2 倍→ ' + fmt(scen(1.2)) + ' 元。' + light + '。已存檔，季末損益分析會直接拿這份來對帳。',
      };
    },
  },
  sow: {
    inputs: [
      { key: 'temp', label: '未來7日均溫', unit: '°C', def: '24' },
      { key: 'rain', label: '未來7日累積雨量', unit: 'mm', def: '18' },
    ],
    async prepare() {
      try {
        const d = await getWeather();
        const avg = d.temperature_2m_max.map((x, i) => (x + d.temperature_2m_min[i]) / 2);
        const t = (avg.reduce((a, b) => a + b, 0) / avg.length).toFixed(1);
        const r = d.precipitation_sum.reduce((a, b) => a + b, 0).toFixed(1);
        const ti = document.getElementById('f_temp'), ri = document.getElementById('f_rain');
        if (ti) ti.value = t;
        if (ri) ri.value = r;
        calcNote('📡 已自動帶入 <b>' + CROP.county + '未來 7 天實際預報</b>（均溫 ' + t + '°C、累積雨量 ' + r + ' mm，來源 open-meteo，可手動修改）');
      } catch (e) { calcNote('⚠️ 天氣預報暫時抓不到，請手動輸入。'); }
    },
    run(v) {
      const t = +v.temp, r = +v.rain;
      let level = '理想播種窗口', impact = '發芽整齊、苗勢穩定。', action = '可以安排播種與育苗！';
      if (t < 16 || t > 32 || r > 120) {
        level = '不建議播種'; impact = '低溫/高溫或雨太多，發芽會不整齊、病害風險高。'; action = '建議延後 3–5 天再評估，先處理排水或保溫。';
      } else if ((t >= 16 && t < 20) || (t > 30 && t <= 32) || r > 60) {
        level = '可播但要加強管理'; impact = '發芽與苗勢可能不均，管理成本會高一點。'; action = '可以小面積先播，搭配遮陰／保溫與病害預防。';
      }
      return {
        headline: '判斷結果：' + level + '（均溫 ' + t + '°C、雨量 ' + r + 'mm/7日）',
        detail: impact + ' ' + action + ' 門檻：理想 20~30°C 且 <60mm；16~20°C 或 60~120mm 需管理；<16°C、>32°C 或 >120mm 不建議。',
      };
    },
  },

    prepare() {

      calcNote(bits.length ? '📡 ' + bits.join('；') + '——輸入上季數字就能比' : '先做過成本試算/產量預估，比較才有本季資料。');

    run(v) {
      const cost = NZD.S.get('cost'), y = NZD.S.get('yield');
      if (!cost && !y) return { headline: '本季還沒有資料可以比！', detail: '先用「成本試算」和「產量預估」建立本季數字，季末再回來比。' };
      const cur = { yield: y ? y.total_kg : (cost ? cost.expected_qty : 0), cost: cost ? cost.total_cost : 0, price: cost ? cost.expected_price : 0 };
      const pct = (a, b) => b > 0 ? Math.round((a - b) / b * 100) : 0;
      const dy = pct(cur.yield, +v.lastYield), dc = pct(cur.cost, +v.lastCost), dp = pct(cur.price, +v.lastPrice);
      const good = (dy > 0 ? 1 : 0) + (dc < 0 ? 1 : 0) + (dp > 0 ? 1 : 0);
      const arrow = n => n > 0 ? '↑' + n + '%' : n < 0 ? '↓' + (-n) + '%' : '持平';
      return {
        headline: good >= 2 ? '有進步！三個指標中 ' + good + ' 個變好。' : good === 1 ? '互有勝負——一個指標變好。' : '這季比較辛苦，三個指標都沒贏。',

          + '（' + v.lastPrice + '→' + cur.price + ' 元/kg）。歸因建議：產量掉→回看病蟲害與缺工紀錄；成本升→看成本試算哪項暴增；售價低→分級率與通路要調。',

  harvest: {
    inputs: [
      { key: 'tdate', label: '定植日期', unit: '', def: '', type: 'date' },
    ],
    button: '算採收窗 ›',
    async prepare() {
      const season = NZD.S.get('season');
      if (season && season.transplant_date) {
        document.getElementById('f_tdate').value = season.transplant_date;
        calcNote('📡 已帶入季節檔定植日 ' + season.transplant_date);
      }
    },
    async run(v) {
      if (!v.tdate) return { headline: '先給我定植日期！', detail: '或先到「最佳播種時機」排整季時程，這裡就會自動帶入。' };
      const d = await NZD.D.weather(CROP.county);
      const avg7 = d.temperature_2m_max.slice(0, 7).map((x, i) => (x + d.temperature_2m_min[i]) / 2)
        .reduce((a, b) => a + b, 0) / 7;
      const hw = NZD.harvestWindow(v.tdate, avg7);
      const days = Math.floor((Date.now() - new Date(v.tdate)) / 864e5);
      const toStart = Math.ceil((new Date(hw.start) - Date.now()) / 864e5);
      const hot = avg7 >= NZD.A.hotHarvestAdvance.temp;
      // 搶收判斷：已近窗（≥78天）且 3 日內有暴雨/強風警訊
      let rush = '';
      for (let i = 0; i < 3; i++) {
        const gust = (d.wind_gusts_10m_max || d.wind_speed_10m_max)[i];
        if ((d.precipitation_sum[i] >= NZD.C.alert.rain1d || gust >= NZD.C.alert.windKmh) && days >= 78) {
          rush = ' ⚠️ ' + d.time[i].slice(5).replace('-', '/') + ' 有暴雨/強風警訊——建議提前搶收轉色果與成熟度高的，別等！';
          break;
        }
      }
      let head, det;
      if (toStart > 0) {
        head = '還沒到——大約 ' + toStart + ' 天後（' + hw.start.slice(5).replace('-', '/') + '）進採收窗。';
        det = '你在定植後第 ' + days + ' 天。預計採收窗 ' + hw.start.slice(5).replace('-', '/') + '～' + hw.end.slice(5).replace('-', '/')
          + (hot ? '（近 7 日均溫 ' + avg7.toFixed(1) + '°C ≥ 27°C，已按提早 ' + NZD.A.hotHarvestAdvance.days + ' 天計）' : '')
          + '。這段時間顧好鉀鈣追肥與水分穩定。' + rush;
      } else if (new Date(hw.end) >= Date.now()) {
        head = '就是現在！你已在採收窗內（第 ' + days + ' 天）。';
        det = '建議分批採：先採轉色果與成熟度高的，過熟果影響整批價。窗到 ' + hw.end.slice(5).replace('-', '/') + ' 為止。'
          + rush + ' 採完到「產品分級建議」分級，賣相好的走好通路。';
      } else {
        head = '採收窗已過（第 ' + days + ' 天）——樹上還有果就儘快收！';
        det = '過熟果易裂易爛，收完評估這季紀錄，到「連作障礙預防」看下季怎麼排。';
      }
      NZD.S.set('harvest', { checked_at: new Date().toISOString().slice(0, 10), days, window: hw });
      return { headline: head, detail: det };
    },
  },

    inputs: [

    ],
    button: '幫我分級 ›',
    prepare() {
      const logs = NZD.S.get('logs', []);
      const today = Date.now();
      const spray = logs.find(x => x.cat === '噴藥' && (today - new Date(x.date)) / 864e5 <= 14);
      if (spray) calcNote('⚠️ 日誌記錄 ' + spray.date.slice(5).replace('-', '/') + ' 有噴藥——出貨前務必確認停藥期已過（問清楚藥劑天數）！');
    },
    run(v) {
      const kg = +v.kg || 100;
      const lookIdx = ['色澤均勻', '色澤普通', '色澤不均'].indexOf(v.look);
      const flawIdx = ['無明顯瑕疵', '輕微瑕疵', '明顯瑕疵/軟果'].indexOf(v.flaw);
      const q = lookIdx + flawIdx; // 0 最好 → 4 最差
      const dist = q === 0 ? [70, 25, 5] : q === 1 ? [55, 35, 10] : q === 2 ? [35, 45, 20] : q === 3 ? [20, 45, 35] : [10, 40, 50];
      const A = Math.round(kg * dist[0] / 100), B = Math.round(kg * dist[1] / 100), C = kg - A - B;
      NZD.S.set('grades', { date: new Date().toISOString().slice(0, 10), kg, dist: { A, B, C } });
      return {
        headline: '這批 ' + kg + 'kg 建議分：A 級約 ' + A + 'kg、B 級 ' + B + 'kg、C 級 ' + C + 'kg。',
        detail: 'A 級（果形完整色澤佳）走直銷/電商賣好價（定價工具係數 ×1.15）；B 級走批發正常出；C 級別硬賣——加工（醬/乾）或促銷出清，硬混進好貨會拉低整批價。'
          + '分級標準：A 果形完整色澤均勻無外傷／B 輕微瑕疵不影響食用／C 外觀或硬度不足。接著到「定價策略建議」算各級賣多少。',
      };
    },
  },
  store: {
    inputs: [
      { key: 'temp', label: '儲存溫度', unit: '°C', def: '12' },
      { key: 'rh', label: '儲存濕度', unit: '%', def: '87' },
      { key: 'days', label: '預計存放', unit: '天', def: '5' },
    ],
    button: '檢查儲存條件 ›',
    run(v) {
      const t = +v.temp, rh = +v.rh, want = +v.days || 5;
      const S = NZD.A.storage;
      const issues = [];
      if (t < S.tempLo) issues.push('溫度太低（' + t + '°C）——低於 ' + S.tempLo + '°C 會寒害，果面凹陷水浸狀');
      if (t > S.tempHi) issues.push('溫度偏高（' + t + '°C）——加速後熟軟化');
      if (rh < S.rhLo) issues.push('濕度不足（' + rh + '%）——果實失水皺縮');
      if (rh > S.rhHi) issues.push('濕度過高（' + rh + '%）——易生黴');
      let est = 10;
      if (t > S.tempHi) est -= Math.min(6, (t - S.tempHi));
      if (t < S.tempLo) est = 3;
      if (rh < S.rhLo) est -= 2;
      if (rh > S.rhHi) est -= 2;
      est = Math.max(1, Math.round(est));
      const ok = want <= est;
      return {
        headline: issues.length ? '條件要調：' + issues[0] + '！' : '條件不錯，這樣放大約可撐 ' + est + ' 天。',
        detail: (issues.length ? '全部問題：' + issues.join('；') + '。理想條件 ' + S.tempLo + '~' + S.tempHi + '°C、' + S.rhLo + '~' + S.rhHi + '%RH。照目前條件估可放約 ' + est + ' 天'
          : '理想區間 ' + S.tempLo + '~' + S.tempHi + '°C、' + S.rhLo + '~' + S.rhHi + '%RH 你都有做到')
          + (ok ? '，你要放 ' + want + ' 天沒問題。' : '，但你想放 ' + want + ' 天——撐不到，建議提早出貨或調整條件。')
          + ' 提醒：先分級再入庫；別跟香蕉蘋果同倉（乙烯催熟）。',
      };
    },
  },

    async prepare() {

        calcNote('📡 已帶入你上次記錄的土壤濕度 ' + last.moist + '%（' + (last.date || '').slice(5, 10).replace('-', '/') + ' 記錄）');

  },
  readings: {
    inputs: [
      { key: 'moist', label: '土壤濕度', unit: '%', def: '45' },
      { key: 'temp', label: '棚內/田間溫度', unit: '°C', def: '30' },
      { key: 'rh', label: '空氣濕度', unit: '%', def: '75' },
    ],
    button: '幫我判讀 ›',
    run(v) {
      const m = +v.moist, t = +v.temp, rh = +v.rh;
      const issues = [], tips = [];
      if (m < 30) { issues.push('土壤太乾（' + m + '%）'); tips.push('儘快灌溉，目標 ' + NZD.A.soilMoist.lo + '~' + NZD.A.soilMoist.hi + '%'); }
      else if (m < NZD.A.soilMoist.lo) { issues.push('土壤偏乾'); tips.push('今明安排澆水'); }
      else if (m > NZD.A.soilMoist.hi) { issues.push('土壤偏濕（' + m + '%）'); tips.push('暫停灌溉、檢查排水'); }
      if (t >= NZD.A.houseTemp) { issues.push('溫度過高（' + t + '°C）'); tips.push('立刻通風/遮陰，高溫會日灼與著果不良'); }
      if (rh >= NZD.A.houseRH) { issues.push('濕度過高（' + rh + '%）'); tips.push('加強通風；持續 2 小時以上病害壓力大增'); }
      const rec = NZD.S.get('readings', []);
      rec.unshift({ date: new Date().toISOString(), moist: m, temp: t, rh: rh });
      NZD.S.set('readings', rec.slice(0, 60));
      if (!issues.length) return { headline: '三個數值都在安全範圍，田況不錯！', detail: '土壤 ' + m + '%（目標 ' + NZD.A.soilMoist.lo + '~' + NZD.A.soilMoist.hi + '%）、溫度 ' + t + '°C（警戒 ' + NZD.A.houseTemp + '°C）、濕度 ' + rh + '%（警戒 ' + NZD.A.houseRH + '%）。已記錄，累積起來就能看趨勢。' };
      return { headline: '注意：' + issues.join('、') + '！', detail: '建議動作：' + tips.join('；') + '。已記錄這筆讀值（近 60 筆保留在手機）。' };
    },
  },
  warn: {
    inputs: [],
    button: '檢查未來 16 天 ›',
    async run() {
      const d = await NZD.D.weather(CROP.county);
      const hits = [];
      for (let i = 0; i < d.time.length; i++) {
        const day = d.time[i].slice(5).replace('-', '/');
        if (d.temperature_2m_max[i] >= 35) hits.push(day + ' 高溫 ' + d.temperature_2m_max[i] + '°C：日灼、授粉不良——當天上午遮陰、加強灌溉');
        if (d.temperature_2m_min[i] <= 12) hits.push(day + ' 低溫 ' + d.temperature_2m_min[i] + '°C：生長停滯、裂果風險——前一晚做好保溫');
        if (d.precipitation_sum[i] >= 80) hits.push(day + ' 暴雨 ' + d.precipitation_sum[i] + 'mm：積水與青枯病壓力——先清溝渠、雨後優先排水');
        const gust = (d.wind_gusts_10m_max || d.wind_speed_10m_max)[i];
        if (gust >= NZD.C.alert.windKmh) hits.push(day + ' 強陣風 ' + Math.round(gust) + 'km/h（約10級）：倒伏落果——加固支架、災前拍照存證（申請救助要用）');
      }
      const season = NZD.S.get('season');
      const ph = season ? NZD.phase(season.transplant_date) : null;
      const phNote = ph && ph.days >= 0 ? '你的田正值' + ph.name + '（第 ' + ph.days + ' 天）。' : '';
      if (!hits.length) {
        return {
          headline: CROP.county + '未來 16 天沒有達到警戒的壞天氣，安心工作！',
          detail: '每天都低於警戒門檻（高溫≥35°C、低溫≤12°C、暴雨≥80mm/日、風≥10級）。7 日概況：高溫 '
            + Math.max(...d.temperature_2m_max).toFixed(1) + '°C、低溫 ' + Math.min(...d.temperature_2m_min).toFixed(1)
            + '°C、單日最大雨量 ' + Math.max(...d.precipitation_sum).toFixed(1) + 'mm。' + phNote + '建議每天早上再點一次確認。',
        };
      }
      return {
        headline: '注意！未來 16 天有 ' + hits.length + ' 個警戒訊號，先做防範！',
        detail: phNote + hits.join('｜') + '（門檻與對策依牛蕃茄防災原則，預報來源 open-meteo，每天早上建議重新檢查）',
      };
    },
  },
  price: {
    inputs: [
      { key: 'grade', label: '這批的品質', unit: '', def: 'A級（果形完整、色澤佳）', options: ['A級（果形完整、色澤佳）', 'B級（輕微瑕疵、可正常賣）', 'C級（次級果、建議加工促銷）'] },
      { key: 'channel', label: '要走的通路', unit: '', def: '直銷（市集/宅配）', options: ['批發（果菜市場）', '直銷（市集/宅配）', '電商（網路平台）'] },
    ],
    async prepare() {
      try {
        const m = await getMarket();
        if (m && m.latest_price) {
          _live.basePrice = m.latest_price.price;
          calcNote('📡 今日批發均價 <b>' + m.latest_price.price + ' 元/公斤</b>（AMIS ' + m.latest_price.date + '，自動作為定價基準）');
        } else calcNote('⚠️ 這個作物還沒有即時行情，將以 50 元/公斤示範計算。');
      } catch (e) { calcNote('⚠️ 行情暫時抓不到，將以 50 元/公斤示範計算。'); }
    },
    run(v) {
      const base = _live.basePrice || 50;
      const q = v.grade.startsWith('A') ? 1.15 : v.grade.startsWith('B') ? 1.0 : 0.85;
      const c = v.channel.startsWith('批發') ? 1.0 : v.channel.startsWith('直銷') ? 1.1 : 1.2;
      const p = base * q * c;
      const lo = Math.round(p * 0.95), hi = Math.round(p * 1.05);
      const mood = base < 40 ? '目前行情偏低，別急著全出——好貨可以留給直銷/電商賣好價。'
        : base > 55 ? '目前行情偏高，是出貨的好時機，把握這幾天！'
        : '目前行情中等，照建議價出貨即可。';
      return {
        headline: '這批建議賣 ' + lo + '～' + hi + ' 元/公斤（約 ' + Math.round(lo / 1.5) + '～' + Math.round(hi / 1.5) + ' 元/台斤）！',
        detail: '算法：基準 ' + base + ' 元/公斤（今日批發均價）× 品質係數 ' + q + '（' + v.grade.slice(0, 2) + '）× 通路係數 ' + c
          + '（' + v.channel.split('（')[0] + '）＝ ' + Math.round(p) + ' 元，上下 5% 為議價空間。' + mood
          + ' 行情判讀門檻：<40 偏低、40~55 中等、>55 偏高（牛蕃茄口徑）。',
      };
    },
  },
  yield: {
    inputs: [
      { key: 'area', label: '面積', unit: '分地', def: '1' },
      { key: 'base', label: '基準值', unit: '噸/分地', def: '3.1' },
      { key: 'season', label: '季節', unit: '', def: '春季', options: ['春季', '夏季', '秋季', '冬季'] },
      { key: 'factor', label: '季節係數', unit: '倍率', def: '1' },
    ],
    prepare() {
      const fields = NZD.S.get('fields', []);
      const sum = fields.reduce((x, f) => x + (+f.area_fen || 0), 0);
      if (sum > 0) document.getElementById('f_area').value = sum;
      if (NZD.A._pack) document.getElementById('f_base').value = (NZD.A.normalYieldKgFen / 1000).toFixed(1);
      const season = NZD.S.get('season');
      if (season && season.harvest_start) {
        const m = +season.harvest_start.slice(5, 7);
        const sn = m >= 3 && m <= 5 ? '春季' : m >= 6 && m <= 8 ? '夏季' : m >= 9 && m <= 11 ? '秋季' : '冬季';
        document.getElementById('f_season').value = sn;
        calcNote('📡 已帶入田區合計' + (sum > 0 ? ' ' + sum + ' 分' : '') + '；採收落在 ' + m + ' 月＝' + sn + '（依你的季節檔）');
      } else if (sum > 0) calcNote('📡 已帶入田區合計 ' + sum + ' 分');
    },
    run(v) {
      const a = +v.area || 1, b = +v.base || 3.1, f = +v.factor || 1;
      const sb = v.season === '春季' ? 1.05 : v.season === '夏季' ? 0.85 : v.season === '秋季' ? 1.0 : 0.9;
      const ton = b * a * sb * f;
      const level = f >= 1.1 ? '偏佳年景' : f <= 0.9 ? '偏差年景' : '一般年景';
      NZD.S.set('yield', { saved_at: new Date().toISOString().slice(0, 10), total_kg: Math.round(ton * 1000), area_fen: a });
      const cost = NZD.S.get('cost');
      const cmp = cost && cost.expected_qty ? ' 對照成本試算用的 ' + cost.expected_qty.toLocaleString() + ' kg——'
        + (Math.abs(ton * 1000 - cost.expected_qty) / cost.expected_qty > 0.15 ? '差距超過 15%，建議回成本試算更新產量重算損平價。' : '兩邊差不多，一致。') : '';
      return {
        headline: '這一季預估總產量大約 ' + ton.toFixed(2) + ' 噸（' + level + '）！',
        detail: '公式：面積 × 基準值 × 季節基準倍率 × 季節係數 = ' + a + ' × ' + b + ' × ' + sb + ' × ' + f + '。季節基準倍率：春 1.05、夏 0.85、秋 1.0、冬 0.9。常見區間（±10%）約 ' + (ton * 0.9).toFixed(2) + ' ~ ' + (ton * 1.1).toFixed(2) + ' 噸。已存檔，人力排班會拿去算需要幾個人。' + cmp,
      };
    },
  },
};

// ── render ──
const tabsEl = document.getElementById('tabs');
const toolsEl = document.getElementById('tools');
let active = 0;

function renderTabs() {
  tabsEl.innerHTML = '';
  STAGES.forEach((s, i) => {
    const n = TOOLS.filter(t => t.stage === i).length;
    const el = document.createElement('div');
    el.className = 'tab' + (i === active ? ' on' : '');
    el.innerHTML = s.icon + ' ' + s.name + ' <span class="c">' + n + '</span>';
    el.onclick = () => { active = i; renderTabs(); renderTools(); };
    tabsEl.appendChild(el);
  });
}

function renderTools() {
  toolsEl.innerHTML = '';
  TOOLS.forEach((t, idx) => {
    if (t.stage !== active) return;
    const el = document.createElement('div');
    el.className = 'tool s' + t.stage;
    el.innerHTML = '<div class="ic">' + t.icon + '</div><div class="nm">' + t.name + '</div>'
      + '<div class="ds">' + t.desc + '</div>'
      + '<span class="tg ' + TYPES[t.type].cls + '">' + TYPES[t.type].label + '</span>';
    el.onclick = () => openModal(idx);
    toolsEl.appendChild(el);
  });
}

const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function closeModal() { overlay.classList.remove('show'); }

function openModal(idx) {
  const t = TOOLS[idx];
  let html = '<div class="mhd"><div class="mt">' + t.icon + ' ' + t.name + '</div>'
    + '<button class="mx" onclick="closeModal()">✕</button></div>'
    + '<div class="msub">' + CROP.display + '・' + CROP.county + '｜' + t.desc + '</div>';

  if (t.custom) {
    modal.innerHTML = html + CUSTOMS[t.custom].html();
    overlay.classList.add('show'); overlay.scrollTop = 0;
    CUSTOMS[t.custom].init();
    return;
  }

  if (t.calc) {
    const c = CALCS[t.calc];
    if (c.inputs.length) {
      html += '<div class="inputs">' + c.inputs.map(f => {
        const inner = f.options
          ? '<select id="f_' + f.key + '">' + f.options.map(o => '<option' + (o === f.def ? ' selected' : '') + '>' + o + '</option>').join('') + '</select>'
          : f.type === 'date'
          ? '<input id="f_' + f.key + '" type="date" value="' + f.def + '" style="font-size:15px">'
          : '<div class="inrow"><input id="f_' + f.key + '" type="text" inputmode="decimal" value="' + f.def + '"><span class="u">' + f.unit + '</span></div>';
        return '<div class="infield"><div class="l">' + f.label + (f.unit && f.options ? '（' + f.unit + '）' : '') + '</div>' + inner + '</div>';
      }).join('') + '</div>';
    }
    html += '<div class="extra" id="calcNote" style="display:none;margin-top:10px"></div>'
      + '<button class="gobtn" onclick="runCalc(\'' + t.calc + '\')">' + (c.button || '幫我算算看 ›') + '</button>'
      + '<div class="result" id="calcResult"><img src="toolbox-assets/m_assist_circle.png" alt="農知助理">'
      + '<div><div class="r1" id="resH"></div><div class="r2" id="resD"></div></div></div>';
  }

  // 小抄：專屬包存在 → 依該作物參數動態生成；否則顯示牛蕃茄版
  const dynP = (NZD.A._pack && DYN_PRINCIPLES[t.name]) ? DYN_PRINCIPLES[t.name]() : null;
  const packNotes = (NZD.A._pack && NZD.A.notes) ? NZD.A.notes : null;
  if (dynP && dynP.length) {
    html += '<div class="ptitle">📌 「' + CROP.display + '」小抄（依專屬參數）</div><div class="plist">'
      + dynP.map(p => '<div class="pitem">' + p + '</div>').join('') + '</div>';
  } else if (packNotes && t.principles && t.principles.length) {
    html += '<div class="ptitle">📌 「' + CROP.display + '」種植小抄（通則整理）</div><div class="plist">'
      + packNotes.map(p => '<div class="pitem">' + p + '</div>').join('') + '</div>';
  } else if (t.principles && t.principles.length) {
    const ph = CROP.isTomato ? '📌 牛蕃茄小抄（固定原則）'
      : '📌 小抄（以牛蕃茄示範，「' + CROP.display + '」版準備中）';
    html += '<div class="ptitle">' + ph + '</div><div class="plist">'
      + t.principles.map(p => '<div class="pitem">' + p + '</div>').join('') + '</div>';
  }
  if (t.extra && !(NZD.A._pack && /牛蕃茄|番茄/.test(t.extra))) html += '<div class="extra">' + t.extra + '</div>';
  if (t.calc && !CROP.isTomato) html += '<div class="extra">' + (NZD.A._pack
    ? '＊數字為「' + CROP.display + '」的通則參考（' + NZD.A._pack.updated + ' 整理），實際請依品種與當地條件調整。'
    : '＊試算參數以牛蕃茄常態為預設，「' + CROP.display + '」專屬參數陸續補上。') + '</div>';
  if (!t.calc) html += '<span class="phase-badge">🔧 完整互動功能規劃中（目前提供原則建議）</span>';

  modal.innerHTML = html;
  overlay.classList.add('show');
  overlay.scrollTop = 0;
  // 自動預填（例如抓即時天氣/行情帶入欄位）
  if (t.calc && CALCS[t.calc].prepare) {
    Promise.resolve(CALCS[t.calc].prepare()).catch(() => {});
  }
}

        + '<div class="infield"><div class="l">主要通路</div><select id="fm_ch">' + ['批發','直銷','電商'].map(c => '<option' + (p.channel_pref === c ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></div>'
        + '</div>'
        + '<div class="ptitle" style="margin-top:14px">🗺 我的田區（成本試算會自動帶面積）</div><div class="plist" id="fm_list"></div>'
        + '<div class="inputs" style="grid-template-columns:2fr 1fr auto;margin-top:8px;align-items:end">'
        + '<div class="infield"><div class="l">田區名</div><input id="fm_fname" type="text" placeholder="例：東邊那塊" style="font-size:14px"></div>'
        + '<div class="infield"><div class="l">面積</div><div class="inrow"><input id="fm_farea" type="text" inputmode="decimal" placeholder="2"><span class="u">分</span></div></div>'
        + '<button class="gobtn" id="fm_addf" style="margin-top:0;padding:11px 18px;width:auto">＋</button>'
        + '</div>'
        + '<button class="gobtn" id="fm_save">儲存設定 ›</button>'
        + '<div class="ptitle" style="margin-top:16px">💾 備份（很重要！）</div>'
        + '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">'
        + '<button class="gobtn" id="fm_exp" style="margin-top:0;width:auto;padding:10px 18px">匯出備份檔</button>'
        + '<label class="gobtn" style="margin-top:0;width:auto;padding:10px 18px;background:#fff;color:#7a5418;border:2px solid #d8c9a4;box-shadow:none;cursor:pointer">匯入備份<input id="fm_imp" type="file" accept=".json" style="display:none"></label>'
        + '</div>'
        + '<div class="extra">所有工具的紀錄（日誌/讀值/成本/田區）都存在這支手機的瀏覽器。換手機或清瀏覽資料前，先匯出備份檔傳給自己。</div>';
    },
    init() {
      const renderF = () => {
        const fs = NZD.S.get('fields', []);
        document.getElementById('fm_list').innerHTML = fs.length
          ? fs.map((f, i) => '<div class="pitem" style="display:flex;gap:8px;align-items:baseline"><span style="flex:1"><b>' + f.name.replace(/</g, '&lt;') + '</b>　' + f.area_fen + ' 分</span><a href="javascript:void 0" data-fdel="' + i + '" style="color:#b05548;font-weight:900;text-decoration:none">✕</a></div>').join('')
          : '<div class="pitem" style="color:#a89070">還沒有田區——右下 ＋ 加一塊！</div>';
        document.querySelectorAll('#fm_list [data-fdel]').forEach(a => a.onclick = () => {
          const fs2 = NZD.S.get('fields', []); fs2.splice(+a.dataset.fdel, 1); NZD.S.set('fields', fs2); renderF();
        });
      };
      document.getElementById('fm_addf').onclick = () => {
        const name = document.getElementById('fm_fname').value.trim();
        const area = +document.getElementById('fm_farea').value;
        if (!name || !(area > 0)) return;
        const fs = NZD.S.get('fields', []);
        fs.push({ id: 'f' + Date.now(), name, area_fen: area });
        NZD.S.set('fields', fs);
        document.getElementById('fm_fname').value = ''; document.getElementById('fm_farea').value = '';
        renderF();
      };
      document.getElementById('fm_save').onclick = () => {
        NZD.S.set('profile', { farm_name: document.getElementById('fm_name').value.trim(),
          channel_pref: document.getElementById('fm_ch').value, county: CROP.county, crop: CROP.display,
          updated_at: new Date().toISOString() });
        closeModal();
      };
      document.getElementById('fm_exp').onclick = () => {
        const blob = new Blob([NZD.S.exportAll()], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '小農工具箱備份_' + new Date().toISOString().slice(0, 10) + '.json';
        a.click(); URL.revokeObjectURL(a.href);
      };
      document.getElementById('fm_imp').onchange = async e => {
        const f = e.target.files[0]; if (!f) return;
        try { const n = NZD.S.importAll(await f.text()); alert('匯入完成，共還原 ' + n + ' 類資料。'); closeModal(); }
        catch (err) { alert('匯入失敗：' + err.message); }
      };
      renderF();
    },
  },
};

function openCustom(kind, title, desc) {
  modal.innerHTML = '<div class="mhd"><div class="mt">' + title + '</div>'
    + '<button class="mx" onclick="closeModal()">✕</button></div>'
    + '<div class="msub">' + desc + '</div>' + CUSTOMS[kind].html();
  overlay.classList.add('show'); overlay.scrollTop = 0;
  CUSTOMS[kind].init();
}
document.getElementById('farmbtn')?.addEventListener('click', () =>
  openCustom('farm', '⚙️ 我的農場', '田區、通路與資料備份——所有工具共用這裡的設定'));

/* ── 縣市/作物切換器 ── */
(function initSwitcher() {
  const sc = document.getElementById('sw_county'), sp = document.getElementById('sw_crop');
  if (!sc) return;
  sc.innerHTML = NZD.D.countyList().map(c => '<option' + (c === CROP.county ? ' selected' : '') + '>' + c + '</option>').join('');
  sp.innerHTML = NZD.D.cropList().map(c => '<option' + (c === CROP.display ? ' selected' : '') + '>' + c + '</option>').join('');
  const go = () => {
    NZD.S.set('pref', { county: sc.value, crop: sp.value });
    const p = new URLSearchParams(location.search);
    p.set('county', sc.value); p.set('crop', sp.value);
    location.search = p.toString();
  };
  sc.onchange = go; sp.onchange = go;
})();

renderTabs();
renderTools();
</script>
</body></html>
