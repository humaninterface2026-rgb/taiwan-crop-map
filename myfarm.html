<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的農場島｜農知島</title>
<script src="toolbox-shared.js?v=20260815a"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','PingFang TC',sans-serif;background:#faf6ec;color:#5a4a30;min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:1180px;margin:0 auto;padding:20px 22px 40px;width:100%;flex:1}
/* 固定 banner：只留置中 logo、點了回作物地圖——與工具箱同款（Keny 規格） */
header{display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:60;background:#faf6ec;padding:9px 0 8px;border-bottom:1.5px solid #eee2cc}
header img.logo{height:36px;display:block}
@media(max-width:640px){header img.logo{height:30px}}
.backlink{font-size:13px;font-weight:900;color:#7a5418;text-decoration:none;background:#fff;border:2px solid #e0d4b4;border-radius:99px;padding:8px 16px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin:12px 0 2px}
h1{font-size:24px;font-weight:900;color:#5a4a30;letter-spacing:2px;margin:10px 0 2px}
.sub{font-size:12.5px;color:#a89070;margin-bottom:16px}
.cols{display:grid;grid-template-columns:410px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
/* 農場地圖：九向網格（北西/北/北東 … 中 … 南東），位置由田區「方位」決定，不用拖 */
.island{background:#b7ab99;border-radius:22px;padding:18px;min-height:340px}
.island .it{font-size:15px;font-weight:900;color:#fff;letter-spacing:2px;margin-bottom:12px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.plots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;
 grid-template-areas:"nw n ne" "w c e" "sw s se"}
.cell{display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:0}
.cell-nw{grid-area:nw}.cell-n{grid-area:n}.cell-ne{grid-area:ne}
.cell-w{grid-area:w}.cell-c{grid-area:c}.cell-e{grid-area:e}
.cell-sw{grid-area:sw}.cell-s{grid-area:s}.cell-se{grid-area:se}
.ihint{font-size:10.5px;color:#f4efe2;margin-top:12px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.12);line-height:1.7}
.plot{background:#7fb069;border:none;border-radius:16px;padding:12px 8px;text-align:center;cursor:pointer;position:relative;font-family:inherit;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.plot.on{outline:4px solid #ffd97a}
.plot .pn{font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.2);word-break:break-all;padding-right:48px;text-align:left}
@media(max-width:520px){.plot .pn{padding-right:0;padding-top:18px}}
.plot .pa{position:absolute;top:7px;right:9px;font-size:16px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.plot .pa small{font-size:10px;font-weight:700}
.plot img{margin:8px auto 2px;display:block;max-width:88%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}
.plot .pc{font-size:12px;font-weight:900;color:#eafbe0}
.plot.empty{background:#98a88e;border:2.5px dashed #d6e2cd;box-shadow:none}
.plot.empty .pe{font-size:26px;color:#eef4e8;margin:14px 0 4px}
.plot.empty .pc{color:#e4ecdd}
/* 月曆 */
.panel{background:#b7ab99;border-radius:22px;padding:18px}
.panel .pt{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.panel .pt .t{font-size:15px;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.mnav{margin-left:auto;display:flex;gap:6px;align-items:center}
.mnav button{font-family:inherit;font-size:14px;font-weight:900;border:none;background:#fff;color:#7a5418;border-radius:9px;width:30px;height:30px;cursor:pointer}
.mnav .mm{font-size:14px;font-weight:900;color:#fff;min-width:96px;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calgrid .wd{font-size:12px;font-weight:900;color:#fff;text-align:center;padding:4px 0;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.day{background:#fdf9ee;border-radius:10px;min-height:66px;padding:5px 6px;font-size:11px;position:relative}
.day.out{opacity:.35}
.day.today{outline:2.5px solid #ffd97a}
.day.has{cursor:pointer}
.day .dn{font-weight:900;color:#8a7a56;font-size:11px}
/* 事件條固定一行：字級不變、超出以 … 收尾，格子不會被長字撐高；點格子開浮層看全文 */
.ev{margin-top:3px;border-radius:6px;padding:2px 5px;font-size:10.5px;font-weight:900;line-height:1.35;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dpop{position:absolute;z-index:40;top:calc(100% + 4px);left:0;background:#fff;border-radius:12px;box-shadow:0 8px 26px rgba(0,0,0,.24);padding:10px 12px;width:200px;text-align:left}
.dpop.right{left:auto;right:0}
.dpop.up{top:auto;bottom:calc(100% + 4px)}
.dpop .dh{font-size:12px;font-weight:900;color:#8a7a56;margin-bottom:2px}
.dpop .ev{white-space:normal;overflow:visible;text-overflow:clip;margin-top:5px;font-size:11.5px;line-height:1.5}
.ev.sow{background:#ffd97a;color:#7a5418}
.ev.tp{background:#e8a952;color:#fff}
.ev.phase{background:#57b8a2;color:#fff}
.ev.harv{background:#e8828c;color:#fff}
.ev.log{background:#cde6a8;color:#4a6420}
/* Info */
.info{background:#fff;border-radius:16px;padding:14px 16px;margin-top:14px}
.info .ih{display:flex;gap:12px;align-items:center}
.info .ih img{height:64px}
.info .ih .t{font-size:16px;font-weight:900;color:#5a4a30}
.info .ih .s{font-size:12px;color:#a89070;margin-top:2px}
.kv{margin-top:10px;font-size:12.5px;line-height:2;color:#5a4a30}
.kv b{color:#3d5a20}
.phaselist{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.ph{border-left:4px solid #57b8a2;background:#f4faf7;border-radius:0 10px 10px 0;padding:7px 10px}
.ph .pn2{font-size:12.5px;font-weight:900;color:#2e7c6c}
.ph .pd{font-size:11px;color:#8a9668}
.ph .pf{font-size:11.5px;color:#5a4a30;margin-top:3px;line-height:1.6}
.cta{display:block;text-align:center;background:#8aa353;color:#fff;font-weight:900;font-size:13.5px;text-decoration:none;border-radius:12px;padding:12px;margin-top:12px}
.foot{font-size:10.5px;color:#a89070;margin-top:12px;line-height:1.7}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:10.5px;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.wave{margin-top:44px;height:86px;background:radial-gradient(120% 70px at 50% 0,#faf6ec 60%,transparent 61%),#a3b86c;position:relative;flex:none}
.wave .cp{position:absolute;bottom:18px;width:100%;text-align:center;font-size:12px;color:#f4f8e6;font-weight:700}
.empty-state{background:#fdf9ee;border:2px dashed #cdbd93;border-radius:16px;padding:26px 20px;text-align:center;font-size:14px;color:#8a7a56;line-height:2}
</style></head>
<body>
<div class="wrap">
  <header>
    <a href="./index.html" title="回農知島首頁" style="line-height:0"><img class="logo" src="toolbox-assets/logo_nongzhidao.png" alt="農知島"></a>
  </header>
  <div class="hbtns">
    <a class="backlink" id="tbLink" href="./toolbox.html">🧰 小農工具箱</a>
    <a class="backlink" href="./crop-dashboard.html">📊 行情儀表板</a>
  </div>
  <h1 id="farmTitle">🏝 我的農場島</h1>
  <div class="sub">你的地、你的作物、你的整季規劃——資料都存在這支裝置的瀏覽器裡</div>

  <div class="cols">
    <div class="island">
      <div class="it" id="islandTitle">我的農場</div>
      <div class="plots" id="plots"></div>
      <div class="ihint" id="ihint" style="display:none">📍 地塊位置＝田區設定的方位、大小依面積——到工具箱「⚙️ 農場設置」調整</div>
    </div>
    <div>
      <div class="panel">
        <div class="pt"><span class="t">種植規劃表</span>
          <span class="mnav"><button id="mPrev">‹</button><span class="mm" id="mLabel"></span><button id="mNext">›</button></span>
        </div>
        <div class="calgrid" id="cal"></div>
        <div class="legend">
          <span><i style="background:#ffd97a"></i>播種</span><span><i style="background:#e8a952"></i>定植</span>
          <span><i style="background:#57b8a2"></i>生長階段</span><span><i style="background:#e8828c"></i>採收</span>
          <span><i style="background:#cde6a8"></i>我的日誌</span>
        </div>
      </div>
      <div class="info" id="info"></div>
    </div>
  </div>
</div>
<div class="wave"><div class="cp">農知島 The Island of Harvest｜我的農場島</div></div>

<script>
const S = NZD.S;
const esc = s => String(s == null ? '' : s).replace(/</g, '&lt;');
let CHARS = {}, PARAMS = {};
let fields = S.get('fields', []) || [];
let selIdx = 0;
let curMonth;   // Date（該月 1 號）

function loadSeasons() {
  const m = S.get('seasons', {}) || {};
  const legacy = S.get('season');
  if (legacy && legacy.crop && !m[legacy.crop]) m[legacy.crop] = legacy;
  return m;
}
let seasonsMap = loadSeasons();

// 手機按「返回」鍵回來常走 bfcache（腳本不重跑）——重讀資料再畫，工具箱剛改的方位/田區才會反映
window.addEventListener('pageshow', e => {
  if (e.persisted) {
    fields = S.get('fields', []) || [];
    seasonsMap = loadSeasons();
    if (selIdx >= fields.length) selIdx = Math.max(0, fields.length - 1);
    initMonth(); renderAll();
  }
});

function d2iso(d) {  // 本地日期（不能用 toISOString——UTC 轉換會讓台灣時區整體位移一天）
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function addDays(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d2iso(d); }

// 由「排好的時程＋參數包生長階段＋作業日誌」組出事件表：date → [{cls,label}]
function buildEvents(plot) {
  const ev = {};
  const push = (iso, cls, label) => { if (!iso) return; (ev[iso] = ev[iso] || []).push({ cls, label }); };
  const season = plot.crop ? seasonsMap[plot.crop] : null;
  if (season) {
    push(season.sow_date, 'sow', '播種日');
    if (season.transplant_date && season.transplant_date !== season.sow_date)
      push(season.transplant_date, 'tp', '定植');
    const pack = (PARAMS[plot.crop] || {});
    const phases = pack.growthPhases || [];
    const base = season.transplant_date || season.sow_date;
    phases.forEach(p => {
      if (base && p.lo > 0 && p.hi < 900) push(addDays(base, p.lo), 'phase', '進入' + p.name);
      else if (base && p.lo > 0) push(addDays(base, p.lo), 'phase', '進入' + p.name);
    });
    push(season.harvest_start, 'harv', '預計開採');
    if (season.harvest_end && season.harvest_end !== season.harvest_start)
      push(season.harvest_end, 'harv', '採收結束');
  }
  (S.get('logs', []) || []).forEach(l => {
    if (l && l.date) push(l.date, 'log', '📓 ' + (l.cat || '') + ' ' + (l.txt || '').slice(0, 8));
  });
  return ev;
}

// 九向格：田區可設 dir（方位）；沒設的依序自動補位（中→東→西→南→北→東南→西北→東北→西南）
const DIR_ORDER = ['c', 'e', 'w', 's', 'n', 'se', 'nw', 'ne', 'sw'];
const CELL_ORDER = ['nw', 'n', 'ne', 'w', 'c', 'e', 'sw', 's', 'se'];
function placedDirs() {  // 只算顯示位置，不寫回儲存
  const used = {};
  const out = fields.map(f => {
    const d = DIR_ORDER.indexOf(f.dir) >= 0 ? f.dir : '';
    if (d) used[d] = (used[d] || 0) + 1;
    return d;
  });
  out.forEach((d, i) => {
    if (!d) {
      const free = DIR_ORDER.find(k => !used[k]) || 'c';
      used[free] = (used[free] || 0) + 1;
      out[i] = free;
    }
  });
  return out;
}

function renderPlots() {
  const box = document.getElementById('plots');
  const hint = document.getElementById('ihint');
  if (!fields.length) {
    box.innerHTML = '<div class="empty-state" style="grid-column:1/-1">還沒有田區。<br>到工具箱「⚙️ 農場設置」加一塊地、設定種什麼，<br>回來這裡就會看到你的農場島。</div>';
    if (hint) hint.style.display = 'none';
    document.getElementById('info').innerHTML =
      '<a class="cta" href="./toolbox.html">🧰 去工具箱建立我的農場 ›</a>';
    return;
  }
  if (hint) hint.style.display = '';
  const dirs = placedDirs();
  const maxA = Math.max.apply(null, fields.map(f => +f.area_fen || 1).concat([1]));
  const plotHtml = (f, i) => {
    const s = Math.max(0.6, Math.min(1, Math.sqrt((+f.area_fen || 1) / maxA)));  // 面積→大小（開根號比例）
    const imgH = Math.round(100 * s);
    if (!f.crop) {
      return '<button class="plot empty' + (i === selIdx ? ' on' : '') + '" data-i="' + i + '">'
        + '<span class="pa">' + esc(f.area_fen) + '<small> 分</small></span>'
        + '<div class="pn">' + esc(f.name) + '</div><div class="pe" style="font-size:' + Math.round(26 * s + 8) + 'px">＋</div>'
        + '<div class="pc">還沒設定作物</div></button>';
    }
    const uri = CHARS[f.crop === '番茄' ? '牛蕃茄' : f.crop] || '';
    return '<button class="plot' + (i === selIdx ? ' on' : '') + '" data-i="' + i + '">'
      + '<span class="pa">' + esc(f.area_fen) + '<small> 分</small></span>'
      + '<div class="pn">' + esc(f.name) + '</div>'
      + (uri ? '<img src="' + uri + '" alt="' + esc(f.crop) + '" style="height:' + imgH + 'px">'
             : '<div class="pe" style="font-size:' + Math.round(40 * s) + 'px;margin:10px 0">🌱</div>')
      + '<div class="pc">' + esc(f.crop) + '</div></button>';
  };
  box.innerHTML = CELL_ORDER.map(cell =>
    '<div class="cell cell-' + cell + '">'
    + fields.map((f, i) => dirs[i] === cell ? plotHtml(f, i) : '').join('')
    + '</div>').join('');
  box.querySelectorAll('.plot').forEach(b => b.onclick = () => { selIdx = +b.dataset.i; initMonth(); renderAll(); });
}

function initMonth() {
  const plot = fields[selIdx];
  const season = plot && plot.crop ? seasonsMap[plot.crop] : null;
  const anchor = season ? (season.transplant_date || season.sow_date) : null;
  const d = anchor ? new Date(anchor + 'T12:00:00') : new Date();
  curMonth = new Date(d.getFullYear(), d.getMonth(), 1);
}

let curEvMap = {};   // 本月事件表（日期→事件），給點擊浮層用
let openPop = null;
function closePop() { if (openPop) { openPop.remove(); openPop = null; } }

function renderCal() {
  closePop();
  const plot = fields[selIdx] || {};
  const ev = curEvMap = buildEvents(plot);
  const y = curMonth.getFullYear(), m = curMonth.getMonth();
  document.getElementById('mLabel').textContent = y + ' 年 ' + (m + 1) + ' 月';
  const first = new Date(y, m, 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const todayISO = d2iso(new Date());
  let html = ['日', '一', '二', '三', '四', '五', '六'].map(w => '<div class="wd">' + w + '</div>').join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const iso = d2iso(d);
    const out = d.getMonth() !== m;
    const evs = ev[iso] || [];
    html += '<div class="day' + (out ? ' out' : '') + (iso === todayISO ? ' today' : '') + (evs.length ? ' has' : '') + '" data-iso="' + iso + '">'
      + '<div class="dn">' + (d.getMonth() + 1) + '/' + d.getDate() + '</div>'
      + evs.slice(0, 3).map(e => '<div class="ev ' + e.cls + '">' + esc(e.label) + '</div>').join('')
      + (evs.length > 3 ? '<div class="ev log">+' + (evs.length - 3) + '</div>' : '')
      + '</div>';
  }
  const grid = document.getElementById('cal');
  grid.innerHTML = html;
  // 點有事件的格子 → 原字級浮層看全文；再點一次或點外面關閉
  grid.querySelectorAll('.day.has').forEach(el => el.onclick = e => {
    e.stopPropagation();
    if (openPop && openPop.parentElement === el) { closePop(); return; }
    closePop();
    const evs = curEvMap[el.dataset.iso] || [];
    const pop = document.createElement('div');
    const r = el.getBoundingClientRect(), g = grid.getBoundingClientRect();
    let cls = 'dpop';
    if (r.left + r.width / 2 - g.left > g.width / 2) cls += ' right';
    if (r.top - g.top > g.height * 0.55) cls += ' up';
    pop.className = cls;
    const mm = +el.dataset.iso.slice(5, 7), dd = +el.dataset.iso.slice(8, 10);
    pop.innerHTML = '<div class="dh">' + mm + '/' + dd + ' 的安排</div>'
      + evs.map(ee => '<div class="ev ' + ee.cls + '">' + esc(ee.label) + '</div>').join('');
    el.appendChild(pop);
    openPop = pop;
  });
}

function renderInfo() {
  const plot = fields[selIdx];
  const box = document.getElementById('info');
  if (!plot) { box.innerHTML = '<a class="cta" href="./toolbox.html">🧰 去工具箱建立我的農場 ›</a>'; return; }
  const p = S.get('profile', {}) || {};
  if (!plot.crop) {
    box.innerHTML = '<div class="kv"><b>' + esc(plot.name) + '</b>（' + esc(plot.area_fen) + ' 分）還沒設定作物。</div>'
      + '<a class="cta" href="./toolbox.html">🧰 到工具箱「⚙️ 農場設置」設定作物 ›</a>';
    return;
  }
  const season = seasonsMap[plot.crop];
  const uri = CHARS[plot.crop === '番茄' ? '牛蕃茄' : plot.crop] || '';
  const pack = PARAMS[plot.crop] || {};
  let html = '<div class="ih">' + (uri ? '<img src="' + uri + '">' : '')
    + '<div><div class="t">' + esc(plot.crop) + '</div>'
    + '<div class="s">' + esc(p.farm_name || '我的農場') + '｜' + esc(plot.name) + '（' + esc(plot.area_fen) + ' 分）</div></div></div>';
  if (season) {
    html += '<div class="kv">'
      + (season.sow_date ? '播種日：<b>' + season.sow_date + '</b><br>' : '')
      + (season.transplant_date ? '定植日：<b>' + season.transplant_date + '</b><br>' : '')
      + (season.harvest_start ? '預計採收：<b>' + season.harvest_start + (season.harvest_end ? ' ～ ' + season.harvest_end : '') + '</b>' : '')
      + '</div>';
    const base = season.transplant_date || season.sow_date;
    const phases = pack.growthPhases || [];
    if (base && phases.length) {
      html += '<div class="phaselist">' + phases.map(ph => {
        const from = addDays(base, ph.lo);
        const to = ph.hi < 900 ? addDays(base, ph.hi) : (season.harvest_end || '採收季');
        return '<div class="ph"><div class="pn2">' + esc(ph.name) + '</div>'
          + '<div class="pd">' + from + ' ～ ' + to + '</div>'
          + (ph.fert ? '<div class="pf">' + esc(ph.fert) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
    }
    html += '<div class="foot">＊時程來自你在工具箱「最佳播種時機」排定的整季計畫；生長階段區間依本作物參數推算；📓 為你的作業日誌紀錄。</div>';
    // 匯出卡是給消費者看的實體卡——只在有排時程時開放，卡上才不會出現空欄或 App 導引文字
    html += '<button class="cta" id="expCard" style="width:100%;border:none;cursor:pointer;font-family:inherit">🖨 匯出資訊卡（可印出隨箱附上）</button>';
  } else {
    html += '<div class="kv">這塊地還沒排整季時程。</div>'
      + '<a class="cta" href="./toolbox.html?crop=' + encodeURIComponent(plot.crop) + '">📅 到工具箱幫「' + esc(plot.crop) + '」排時程 ›</a>';
  }
  box.innerHTML = html;
  const eb = document.getElementById('expCard');
  if (eb) eb.onclick = () => exportCard(plot);
}

/* ── 資訊卡匯出：畫成 PNG 讓農友印出隨箱附上（只放真實資料；自主記錄非官方驗證） ── */
function _rrect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
// 舊版 Firefox 對只有 viewBox 的 SVG 會回報 0×0（drawImage 會靜默失敗）——當成載入失敗走降級路徑
function _limg(src) { return new Promise(res => { if (!src) return res(null); const im = new Image(); im.onload = () => res(im.width > 0 && im.height > 0 ? im : null); im.onerror = () => res(null); im.src = src; }); }
async function exportCard(plot) {
  const p = S.get('profile', {}) || {};
  const season = seasonsMap[plot.crop] || null;
  const pack = PARAMS[plot.crop] || {};
  const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  const phaseLines = [];
  if (season) {
    const b = season.transplant_date || season.sow_date;
    (pack.growthPhases || []).forEach(ph => {
      if (!b) return;
      const from = addDays(b, ph.lo);
      const to = ph.hi < 900 ? addDays(b, ph.hi) : (season.harvest_end || '採收季');
      phaseLines.push({ n: ph.name, d: from + ' ～ ' + to });
    });
  }
  const kvLines = [];
  if (season) {
    if (season.sow_date) kvLines.push(['播種日', season.sow_date]);
    if (season.transplant_date && season.transplant_date !== season.sow_date) kvLines.push(['定植日', season.transplant_date]);
    if (season.harvest_start) kvLines.push(['預計採收', season.harvest_start + (season.harvest_end ? ' ～ ' + season.harvest_end : '')]);
  }
  const W = 1000;
  const H = 560 + kvLines.length * 52 + (phaseLines.length ? 60 + phaseLines.length * 74 : 70) + 244;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#faf6ec'; ctx.fillRect(0, 0, W, H);
  _rrect(ctx, 40, 40, W - 80, H - 80, 36);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = '#e0d4b4'; ctx.stroke();
  const [logo, chr] = await Promise.all([
    _limg('toolbox-assets/logo_nongzhidao.png'),
    _limg(CHARS[plot.crop === '番茄' ? '牛蕃茄' : plot.crop] || ''),
  ]);
  let y = 100;
  if (chr) {
    const ch = 250, cw = chr.width / chr.height * ch;
    ctx.drawImage(chr, (W - cw) / 2, y, cw, ch); y += ch + 46;
  } else y += 30;
  // 長字自動縮級再畫（超過安全寬就一路降字級，比照站內長名階梯縮字）
  const fitFont = (weight, size, text, maxW) => {
    let s = size; ctx.font = weight + ' ' + s + 'px ' + FONT;
    while (s > 16 && ctx.measureText(text).width > maxW) { s -= 2; ctx.font = weight + ' ' + s + 'px ' + FONT; }
  };
  ctx.textAlign = 'center'; ctx.fillStyle = '#5a4a30';
  fitFont('900', 58, plot.crop, 820);
  ctx.fillText(plot.crop, W / 2, y); y += 52;
  const subT = (p.farm_name || '我的農場') + '｜' + plot.name + '（' + plot.area_fen + ' 分）';
  ctx.fillStyle = '#a89070';
  fitFont('700', 27, subT, 820);
  ctx.fillText(subT, W / 2, y); y += 44;
  ctx.strokeStyle = '#eee4cc'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(110, y); ctx.lineTo(W - 110, y); ctx.stroke(); y += 54;
  ctx.textAlign = 'left';
  if (kvLines.length) {
    kvLines.forEach(kv => {
      ctx.font = '700 30px ' + FONT; ctx.fillStyle = '#8a7a56';
      ctx.fillText(kv[0] + '：', 120, y);
      ctx.font = '900 30px ' + FONT; ctx.fillStyle = '#3d5a20';
      ctx.fillText(kv[1], 120 + ctx.measureText(kv[0] + '：').width + 60, y);
      y += 52;
    });
  } else {
    // 正常流程到不了這裡（沒排時程不會出現匯出鈕）——保險起見印中性文字，不能有 App 導引字樣
    ctx.font = '700 28px ' + FONT; ctx.fillStyle = '#a89070';
    ctx.fillText('本季時程尚未排定', 120, y); y += 52;
  }
  if (phaseLines.length) {
    y += 24;
    ctx.font = '900 30px ' + FONT; ctx.fillStyle = '#2e7c6c';
    ctx.fillText('🌱 生長階段', 120, y); y += 50;
    phaseLines.forEach(ph => {
      ctx.fillStyle = '#57b8a2'; ctx.fillRect(120, y - 30, 7, 58);
      ctx.font = '900 27px ' + FONT; ctx.fillStyle = '#2e7c6c';
      ctx.fillText(ph.n, 146, y);
      ctx.font = '700 24px ' + FONT; ctx.fillStyle = '#8a9668';
      ctx.fillText(ph.d, 146, y + 34);
      y += 74;
    });
  }
  // 底部：品牌 + 誠實標示（日期是排程推算值，不是逐日實際記錄）+ 合規註記
  let fy = H - 209;
  if (logo) {
    const lh = 52, lw = logo.width / logo.height * lh;
    ctx.drawImage(logo, (W - lw) / 2, fy - 40, lw, lh); fy += 42;
  }
  ctx.textAlign = 'center';
  ctx.font = '700 21px ' + FONT; ctx.fillStyle = '#a89070';
  ctx.fillText('＊日期依農友排定的時程與本作物生長階段推算，非逐日實際記錄', W / 2, fy); fy += 32;
  ctx.fillText('本資訊卡為農友自主記錄，非官方產銷履歷（TAP）驗證', W / 2, fy); fy += 32;
  ctx.fillText('農知島 The Island of Harvest｜我的農場島', W / 2, fy);
  cv.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = (p.farm_name || '我的農場') + '_' + plot.name + '_' + plot.crop + '_資訊卡.png';
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
}

function renderAll() { renderPlots(); renderCal(); renderInfo(); }

document.getElementById('mPrev').onclick = () => { curMonth = new Date(curMonth.getFullYear(), curMonth.getMonth() - 1, 1); renderCal(); };
document.getElementById('mNext').onclick = () => { curMonth = new Date(curMonth.getFullYear(), curMonth.getMonth() + 1, 1); renderCal(); };
document.addEventListener('click', e => { if (openPop && !openPop.contains(e.target)) closePop(); });

(async function boot() {
  const p = S.get('profile', {}) || {};
  if (p.farm_name) {
    document.getElementById('farmTitle').textContent = '🏝 ' + p.farm_name;
    document.getElementById('islandTitle').textContent = p.farm_name + '的島';
  }
  try { CHARS = await (await fetch('toolbox-assets/crop_chars.json')).json(); } catch (e) {}
  try { PARAMS = (await (await fetch('toolbox-assets/crop-params.json')).json()).crops || {}; } catch (e) {}
  // 預設選第一塊有作物的地
  const k = fields.findIndex(f => f.crop);
  selIdx = k >= 0 ? k : 0;
  initMonth();
  renderAll();
})();
</script>
